name: Apply processing payload safety fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject payload changes during an active processing lease
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/backend/src/services/ledger/paymentIngestionService.js')
          text = path.read_text()
          old = "success: terminal || existing.status === 'PROCESSING',"
          new = "success: terminal,"
          if old not in text:
              raise SystemExit('Expected processing payload safety expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'vaayu-ci-bot'
          git config user.email 'vaayu-ci-bot@users.noreply.github.com'
          git add apps/backend/src/services/ledger/paymentIngestionService.js
          git commit -m 'Reject payload mutation during active webhook processing'
          git push origin main
          git rm .github/workflows/apply-processing-payload-safety-fix.yml
          git commit -m 'Remove temporary processing payload safety workflow'
          git push origin main
