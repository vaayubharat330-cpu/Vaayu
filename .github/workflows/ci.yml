name: VAAYU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vaayu_test
          POSTGRES_PASSWORD: vaayu_test_password
          POSTGRES_DB: vaayu
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vaayu_test -d vaayu"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - name: Syntax check (production entry and services)
        run: |
          node --check src/server_production.js
          node --check src/server_bootstrap.js
          for f in src/services/*.js src/db/*.js src/map-engine/*.js; do node --check "$f"; done
      - name: Apply PostgreSQL schema migrations
        env:
          NODE_ENV: test
          PERSISTENCE_PROVIDER: postgres
          DATABASE_URL: postgresql://vaayu_test:vaayu_test_password@localhost:5432/vaayu
        run: npm run migrate:ledger
      - name: Unit tests (auth and OTP security)
        run: npm test
      - name: Dispatch and concurrency regression
        env:
          NODE_ENV: test
          PERSISTENCE_PROVIDER: postgres
          DATABASE_URL: postgresql://vaayu_test:vaayu_test_password@localhost:5432/vaayu
          REDIS_URL: redis://localhost:6379
          ENABLE_DEV_REDIS: 'true'
        run: |
          set -euo pipefail
          run_test() {
            echo "::group::Running $1"
            timeout --signal=TERM 5m npm run "$1"
            echo "::endgroup::"
          }
          run_test test:redis-rate-limit
          run_test test:dispatch
          run_test test:dispatch-recovery
          run_test test:realtime
          run_test test:telemetry-replay
          run_test test:redis-lock
          run_test test:postgres-transition
      - name: Payment and order regression
        env:
          NODE_ENV: test
          PERSISTENCE_PROVIDER: postgres
          DATABASE_URL: postgresql://vaayu_test:vaayu_test_password@localhost:5432/vaayu
          REDIS_URL: redis://localhost:6379
          ENABLE_DEV_REDIS: 'true'
        run: |
          set -euo pipefail
          run_test() {
            echo "::group::Running $1"
            timeout --signal=TERM 5m npm run "$1"
            echo "::endgroup::"
          }
          run_test test:payment-routing
          run_test test:payment-status
          run_test test:payment-ingestion-recovery
          run_test test:idempotency
          run_test test:order-exception-recovery
      - name: Ledger, outbox and reconciliation regression
        env:
          NODE_ENV: test
          PERSISTENCE_PROVIDER: postgres
          DATABASE_URL: postgresql://vaayu_test:vaayu_test_password@localhost:5432/vaayu
          REDIS_URL: redis://localhost:6379
          ENABLE_DEV_REDIS: 'true'
        run: |
          set -euo pipefail
          run_test() {
            echo "::group::Running $1"
            timeout --signal=TERM 5m npm run "$1"
            echo "::endgroup::"
          }
          run_test test:cluster
          run_test test:ledger-pg
          run_test test:outbox
          run_test test:recon
      - name: Camera integrity and route regression
        env:
          NODE_ENV: test
          PERSISTENCE_PROVIDER: postgres
          DATABASE_URL: postgresql://vaayu_test:vaayu_test_password@localhost:5432/vaayu
          REDIS_URL: redis://localhost:6379
          ENABLE_DEV_REDIS: 'true'
        run: |
          set -euo pipefail
          run_test() {
            echo "::group::Running $1"
            timeout --signal=TERM 5m npm run "$1"
            echo "::endgroup::"
          }
          run_test test:camera
          run_test test:camera-policy
          run_test test:camera-integrity
          run_test test:camera-gateway
          run_test test:camera-route-security
      - name: Document and KYC regression
        env:
          NODE_ENV: test
          PERSISTENCE_PROVIDER: postgres
          DATABASE_URL: postgresql://vaayu_test:vaayu_test_password@localhost:5432/vaayu
          REDIS_URL: redis://localhost:6379
          ENABLE_DEV_REDIS: 'true'
        run: |
          set -euo pipefail
          run_test() {
            echo "::group::Running $1"
            timeout --signal=TERM 5m npm run "$1"
            echo "::endgroup::"
          }
          run_test test:document-verification
          run_test test:document-decision
          run_test test:document-capture
          run_test test:kyc-orchestration
          run_test test:kyc-expiry
          run_test test:kyc-review
          run_test test:kyc-review-evidence
          run_test test:kyc-review-routes
          run_test test:kyc-license-db
          run_test test:kyc-license-owner-registry
          run_test test:kyc-persistence
          run_test test:kyc-upload-wiring
      - name: Full HTTP delivery lifecycle E2E
        env:
          NODE_ENV: test
          PERSISTENCE_PROVIDER: postgres
          DATABASE_URL: postgresql://vaayu_test:vaayu_test_password@localhost:5432/vaayu
          REDIS_URL: redis://localhost:6379
          ENABLE_DEV_REDIS: 'true'
          JWT_SECRET: ci-e2e-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          VAAYU_TEST_JWT_SECRET: ci-e2e-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          PORT: '4000'
          HOST: 127.0.0.1
        run: |
          set -euo pipefail
          timeout --signal=TERM 5m npm run db:seed
          node src/server_bootstrap.js > /tmp/vaayu-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; cat /tmp/vaayu-e2e.log' EXIT
          STATUS=000
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/ || true)
            if [ "$STATUS" != "000" ]; then break; fi
            sleep 1
          done
          test "$STATUS" != "000"
          timeout --signal=TERM 5m npm run test:e2e
          timeout --signal=TERM 5m npm run test:e2e:merchant
      - name: Dependency audit (production, fails on high or critical)
        run: timeout --signal=TERM 5m npm audit --omit=dev --audit-level=high

  portals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - name: Build portal bundles (fails if JSX does not compile)
        run: node scripts/build-portals.js
      - name: Bundles parse
        run: |
          for f in public/built/*.js public/driver/app.js; do node --check "$f"; done

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Flutter toolchain
        run: flutter --version
      - name: Resolve packages
        run: timeout --signal=TERM 10m flutter pub get
      - name: Static analysis
        run: timeout --signal=TERM 10m flutter analyze --no-fatal-infos
      - name: Formatting gate (changed Dart files)
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^apps/mobile/(lib|test)/.*\.dart$' || true)
          if [ -z "$changed" ]; then
            echo "No Dart source/test files changed in this commit."
            exit 0
          fi
          printf '%s\n' "$changed" | while IFS= read -r file; do
            dart format --output=none --set-exit-if-changed "$file"
          done
      - name: Mobile unit and regression tests
        run: timeout --signal=TERM 10m flutter test --reporter expanded
