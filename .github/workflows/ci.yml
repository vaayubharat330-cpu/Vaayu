name: VAAYU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vaayu_test
          POSTGRES_PASSWORD: vaayu_test_password
          POSTGRES_DB: vaayu
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vaayu_test -d vaayu"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - name: Syntax check (production entry and services)
        run: |
          node --check src/server_production.js
          node --check src/server_bootstrap.js
          for f in src/services/*.js src/db/*.js src/map-engine/*.js; do node --check "$f"; done
      - name: Unit tests (auth and OTP security)
        run: npm test
      - name: Concurrency, realtime, payment, media and KYC regression suites
        env:
          NODE_ENV: test
          PERSISTENCE_PROVIDER: postgres
          DATABASE_URL: postgresql://vaayu_test:vaayu_test_password@localhost:5432/vaayu
          REDIS_URL: redis://localhost:6379
          ENABLE_DEV_REDIS: 'true'
        run: |
          npm run test:dispatch
          npm run test:dispatch-recovery
          npm run test:realtime
          npm run test:telemetry-replay
          npm run test:redis-lock
          npm run test:postgres-transition
          npm run test:payment-routing
          npm run test:payment-status
          npm run test:idempotency
          npm run test:order-exception-recovery
          npm run test:cluster
          npm run test:ledger-pg
          npm run test:camera
          npm run test:camera-policy
          npm run test:camera-integrity
          npm run test:camera-gateway
          npm run test:camera-route-security
          npm run test:document-verification
          npm run test:document-decision
          npm run test:document-capture
          npm run test:kyc-orchestration
          npm run test:kyc-expiry
          npm run test:kyc-review
          npm run test:kyc-review-routes
          npm run test:kyc-license-db
          npm run test:kyc-license-owner-registry
          npm run test:kyc-persistence
          npm run test:kyc-upload-wiring
      - name: Full HTTP delivery lifecycle E2E
        env:
          NODE_ENV: test
          PERSISTENCE_PROVIDER: postgres
          DATABASE_URL: postgresql://vaayu_test:vaayu_test_password@localhost:5432/vaayu
          REDIS_URL: redis://localhost:6379
          ENABLE_DEV_REDIS: 'true'
          JWT_SECRET: ci-e2e-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          VAAYU_TEST_JWT_SECRET: ci-e2e-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          PORT: '4000'
          HOST: 127.0.0.1
        run: |
          npm run db:seed
          node src/server_bootstrap.js > /tmp/vaayu-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; cat /tmp/vaayu-e2e.log' EXIT
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/ || true)
            if [ "$STATUS" != "000" ]; then break; fi
            sleep 1
          done
          test "$STATUS" != "000"
          npm run test:e2e
          npm run test:e2e:merchant
      - name: Dependency audit (production, fails on high or critical)
        run: npm audit --omit=dev --audit-level=high

  portals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - name: Build portal bundles (fails if JSX does not compile)
        run: node scripts/build-portals.js
      - name: Bundles parse
        run: |
          for f in public/built/*.js public/driver/app.js; do node --check "$f"; done
