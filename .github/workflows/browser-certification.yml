name: VAAYU Browser Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: browser-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Playwright portal certification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: vaayu
          POSTGRES_PASSWORD: vaayu
          POSTGRES_DB: vaayu
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vaayu -d vaayu"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install pinned Playwright runner
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1

      - name: Install Chromium browser and Linux dependencies
        run: npx playwright install chromium --with-deps

      - name: Prepare database
        env:
          DATABASE_URL: postgres://vaayu:vaayu@127.0.0.1:5432/vaayu
          JWT_SECRET: browser-certification-jwt-secret-012345678901234567890123
          OTP_HASH_SECRET: browser-certification-otp-secret-012345678901234567890123
          NODE_ENV: test
          PERSISTENCE_PROVIDER: postgres
        run: |
          npm run migrate:ledger
          npm run db:seed
          node scripts/build-portals.js

      - name: Start VAAYU server
        env:
          DATABASE_URL: postgres://vaayu:vaayu@127.0.0.1:5432/vaayu
          JWT_SECRET: browser-certification-jwt-secret-012345678901234567890123
          OTP_HASH_SECRET: browser-certification-otp-secret-012345678901234567890123
          NODE_ENV: test
          PERSISTENCE_PROVIDER: postgres
          REDIS_PROVIDER: redis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          ENABLE_DEV_REDIS: true
          PORT: 4000
          HOST: 127.0.0.1
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:4000
          ENABLE_TEST_ENDPOINTS: false
          RAZORPAY_ENABLED: false
        run: |
          nohup node src/server_bootstrap.js > /tmp/vaayu-browser-server.log 2>&1 &
          echo $! > /tmp/vaayu-browser-server.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/health > /tmp/vaayu-health.json; then
              cat /tmp/vaayu-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vaayu-browser-server.log
          exit 1

      - name: Run browser certification
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4000
        run: npx playwright test --config=test/browser/playwright.config.js

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vaayu-browser-certification
          path: |
            apps/backend/playwright-report/
            apps/backend/test/browser/test-results/
            /tmp/vaayu-browser-server.log
          if-no-files-found: warn
          retention-days: 14
