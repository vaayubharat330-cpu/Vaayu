name: VAAYU final hardening patch

on:
  push:
    paths:
      - '.github/workflows/vaayu-hardening-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply payment consistency fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          payment = Path('apps/backend/src/http/paymentRoutes.js')
          text = payment.read_text()
          old = "const result = integrationService.getPaymentStatus(tripId);"
          new = "const result = await integrationService.getPaymentStatus(tripId);"
          assert text.count(old) == 1, 'payment status call shape changed unexpectedly'
          payment.write_text(text.replace(old, new))

          booking = Path('apps/backend/src/http/tripBookingRoutes.js')
          text = booking.read_text()
          old = """          if (db.debitCustomerWallet) {\n            db.debitCustomerWallet(customerId, finalTotalFare, tempOrderId);\n          }\n\n"""
          assert text.count(old) == 1, 'wallet debit block changed unexpectedly'
          booking.write_text(text.replace(old, ''))
          PY

          node --check apps/backend/src/http/paymentRoutes.js
          node --check apps/backend/src/http/tripBookingRoutes.js

          git diff --check
          git diff -- apps/backend/src/http/paymentRoutes.js apps/backend/src/http/tripBookingRoutes.js

      - name: Remove temporary patch workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VAAYU Hardening Bot'
          git config user.email 'vaayu-hardening@users.noreply.github.com'
          git add apps/backend/src/http/paymentRoutes.js apps/backend/src/http/tripBookingRoutes.js
          git rm .github/workflows/vaayu-hardening-patch.yml
          git commit -m 'fix: close payment status and wallet escrow consistency gaps'
          git push origin HEAD:main
