name: Apply payment processing lease fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch initial provider-event lease
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/backend/src/services/ledger/paymentIngestionService.js')
          text = path.read_text()
          old = """          signature, status, amount_paise, currency, created_at\n        ) VALUES ($1, $2, $3, $4, $5, $6, 'PROCESSING', $7, $8, NOW())"""
          new = """          signature, status, amount_paise, currency, created_at, processing_started_at\n        ) VALUES ($1, $2, $3, $4, $5, $6, 'PROCESSING', $7, $8, NOW(), NOW())"""
          if old not in text:
              raise SystemExit('Expected provider-event INSERT pattern not found; refusing to mutate the file.')
          if new in text:
              raise SystemExit('Patch already present; refusing a duplicate mutation.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify patch
        run: |
          grep -n -A4 -B2 "processing_started_at" apps/backend/src/services/ledger/paymentIngestionService.js | head -40
          node --check apps/backend/src/services/ledger/paymentIngestionService.js

      - name: Commit fix and remove temporary workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backend/src/services/ledger/paymentIngestionService.js .github/workflows/apply-payment-processing-lease-fix.yml
          git commit -m "Fix initial provider event processing lease"
          git push origin HEAD:main
