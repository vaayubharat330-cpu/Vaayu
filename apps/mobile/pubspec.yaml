name: vaayu_mobile
description: "VAAYU Intra-City Logistics & Mobility Mobile Client Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Secure Storage & Session Foundation
  flutter_secure_storage: ^9.0.0
  jwt_decode: ^0.3.1
  equatable: ^2.0.5

  # Protocol Transport & Network Foundation (P15A.2)
  dio: ^5.4.0
  web_socket_channel: ^2.4.1
  uuid: ^4.3.3

  # State Management & Reactive UI (P15A.4 / P15A.5)
  flutter_bloc: ^8.1.3

  # Device camera and image capture
  camera: ^0.11.0+2
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
