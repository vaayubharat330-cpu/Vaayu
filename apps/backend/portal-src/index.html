<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Tailwind CSS CDN -->

  <!-- Babel Compiler CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone@8.0.7/babel.min.js" integrity="sha384-oO1UkcqdSTjrtWIjKpx1K6eE5I0WAXPWoezFn46CIHNoN6+CGVMK+GNSaDdkJ+u5" crossorigin="anonymous"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    #map { height: 100%; width: 100%; min-height: 480px; border-radius: 1.25rem; z-index: 1; }
    .leaflet-pane { z-index: 10 !important; }
    .leaflet-top, .leaflet-bottom { z-index: 20 !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .clean-leaflet-icon { background: transparent !important; border: none !important; box-shadow: none !important; }

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <div id="root"></div>

  <!-- REACT POST-BOOKING & CUSTOMER APP SCRIPT -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    let vaayuCustomerToken = null;
    const nativeCustomerFetch = window.fetch.bind(window);
    window.fetch = (input, init = {}) => {
      const requestUrl = typeof input === 'string' ? input : input.url;
      if (vaayuCustomerToken && new URL(requestUrl, window.location.href).pathname.startsWith('/api/')) {
        const headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
        headers.set('Authorization', `Bearer ${vaayuCustomerToken}`);
        init = { ...init, headers };
      }
      return nativeCustomerFetch(input, init);
    };

    function CustomerApp() {
      // User Auth State (Starts at Signup/Login screen when not logged in)
      const [currentUser, setCurrentUser] = useState(null);
      const [authTab, setAuthTab] = useState('SIGNUP'); // 'SIGNUP' | 'LOGIN'
      const [authStep, setAuthStep] = useState('PHONE'); // 'PHONE' | 'OTP'
      
      // Sign Up, Login & OTP Form States
      const [signupName, setSignupName] = useState('');
      const [signupPhone, setSignupPhone] = useState('');
      const [signupEmail, setSignupEmail] = useState('');
      const [signupCity, setSignupCity] = useState('Hyderabad');
      const [loginPhone, setLoginPhone] = useState('');
      const [otpCode, setOtpCode] = useState('');
      const [activeOtp, setActiveOtp] = useState('');
      const [otpMsg, setOtpMsg] = useState('');
      const [otpTimer, setOtpTimer] = useState(30);
      const [authError, setAuthError] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      // Navigation & View State
      const [currentView, setCurrentView] = useState('BOOKING'); // 'BOOKING' | 'ORDERS_HISTORY' | 'ACCOUNT' | 'WALLET' | 'SETTINGS' | 'SUPPORT'
      const [bookingStep, setBookingStep] = useState('HOME'); // 'HOME' | 'LOCATION' | 'VEHICLE' | 'PAYMENT'
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [bookingMode, setBookingMode] = useState('LOCAL'); // 'LOCAL' | 'OUTSTATION'
      const [selectedLanguage, setSelectedLanguage] = useState('en'); // 'en' | 'te' | 'hi'

      // Location & Booking States (map defaults are only a Hyderabad search anchor, never a confirmed pickup)
      const [pickupCoords, setPickupCoords] = useState({ lat: 17.4850, lng: 78.4041 });
      const [pickupAddress, setPickupAddress] = useState('');
      const [pickupCoordinatesConfirmed, setPickupCoordinatesConfirmed] = useState(false);
      const [pickupSearchResults, setPickupSearchResults] = useState([]);
      
      const [dropCoords, setDropCoords] = useState({ lat: 17.4401, lng: 78.3489 });
      const [dropAddress, setDropAddress] = useState('');
      const [dropSearchResults, setDropSearchResults] = useState([]);

      // Multi-Stop Routing State (Intermediate Stops)
      const [intermediateStops, setIntermediateStops] = useState([]);

      function handleAddStop() {
        if (intermediateStops.length >= 3) {
          alert('Maximum 3 intermediate stops allowed per trip.');
          return;
        }
        const newStop = {
          id: Date.now(),
          address: '',
          lat: (pickupCoords.lat + dropCoords.lat) / 2,
          lng: (pickupCoords.lng + dropCoords.lng) / 2,
          searchResults: []
        };
        setIntermediateStops([...intermediateStops, newStop]);
      }

      function handleRemoveStop(stopId) {
        setIntermediateStops(intermediateStops.filter(s => s.id !== stopId));
      }

      function handleStopAddressChange(stopId, query) {
        setIntermediateStops(prev => prev.map(s => {
          if (s.id === stopId) {
            return { ...s, address: query };
          }
          return s;
        }));

        if (!query || query.trim().length < 2) {
          setIntermediateStops(prev => prev.map(s => s.id === stopId ? { ...s, searchResults: [] } : s));
          return;
        }

        fetch(`/api/geocoding/search?q=${encodeURIComponent(query.trim())}&refLat=${pickupCoords.lat}&refLng=${pickupCoords.lng}`)
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              setIntermediateStops(prev => prev.map(s => s.id === stopId ? { ...s, searchResults: data.results } : s));
            }
          })
          .catch(() => {});
      }

      function handleSelectStopResult(stopId, item) {
        setIntermediateStops(prev => prev.map(s => {
          if (s.id === stopId) {
            return { ...s, address: item.name, lat: item.lat, lng: item.lng, searchResults: [] };
          }
          return s;
        }));
      }

      const mapRef = useRef(null);
      const mapInstance = useRef(null);
      const polylineRef = useRef(null);
      const pickupMarkerRef = useRef(null);
      const dropMarkerRef = useRef(null);
      const stopMarkersRef = useRef([]);
      const driverMarkerRef = useRef(null);
      const [senderName, setSenderName] = useState('');
      const [senderPhone, setSenderPhone] = useState('');
      const [receiverName, setReceiverName] = useState('');
      const [receiverPhone, setReceiverPhone] = useState('');

      // Vehicle & Addons
      const [selectedVehicle, setSelectedVehicle] = useState('v_ace');
      const [helperCount, setHelperCount] = useState(0);
      const [extraDropsCount, setExtraDropsCount] = useState(0);
      const [waitingTimeMinutes, setWaitingTimeMinutes] = useState(0);
      const [driverTip, setDriverTip] = useState(0);
      const [paymentMethod, setPaymentMethod] = useState('UPI');

      // Scheduled Booking & Goods Classification States
      const [dispatchMode, setDispatchMode] = useState('NOW'); // 'NOW' | 'SCHEDULED'
      const [scheduledDate, setScheduledDate] = useState(new Date().toISOString().split('T')[0]);
      const [scheduledTimeSlot, setScheduledTimeSlot] = useState('09:00 AM - 10:00 AM');
      const [goodsCategory, setGoodsCategory] = useState('House Furniture & Appliances');
      const [isFragile, setIsFragile] = useState(false);
      const [goodsNotes, setGoodsNotes] = useState('');

      const [estimates, setEstimates] = useState([]);
      const [routeMetrics, setRouteMetrics] = useState({ distanceKm: 8.5, durationMin: 26, isDegraded: false, routeProvider: null });

      // Active Trip State & History
      const [activeTrip, setActiveTrip] = useState(null);
      const [tripHistory, setTripHistory] = useState([]);
      const [showSupportModal, setShowSupportModal] = useState(false);
      const [copiedOtp, setCopiedOtp] = useState(false);

      // Wallet Balance State
      const [walletBalance, setWalletBalance] = useState(0);
      const [walletMsg, setWalletMsg] = useState('');

      // Saved Addresses State
      const [savedAddresses, setSavedAddresses] = useState([
        { id: 1, label: 'Home (KPHB)', address: 'KPHB Colony (Phase 1-9), Kukatpally, Hyderabad', lat: 17.4850, lng: 78.4041 },
        { id: 2, label: 'Office (Hitec City)', address: 'Hitec City (Cyber Towers, Mindspace), Hyderabad', lat: 17.4401, lng: 78.3489 },
        { id: 3, label: 'Warehouse (Sanathnagar)', address: 'Sanathnagar Industrial Estate, Hyderabad', lat: 17.4580, lng: 78.4420 }
      ]);
      const [newAddrLabel, setNewAddrLabel] = useState('');
      const [newAddrText, setNewAddrText] = useState('');

      // Notification Toggles
      const [notifSms, setNotifSms] = useState(true);
      const [notifWhatsapp, setNotifWhatsapp] = useState(true);

      // Dispatch Searching Radar & Invoice Modal States
      const [isDispatching, setIsDispatching] = useState(false);
      const [invoiceTrip, setInvoiceTrip] = useState(null);

      // Active Business Advertisements Feed
      const [activeAds, setActiveAds] = useState([]);

      useEffect(() => {
        fetch('/api/advertisements/active')
          .then(r => r.json())
          .then(d => { if (d && d.success) setActiveAds(d.advertisements || []); })
          .catch(() => {});
      }, []);

      function handleAdClick(ad) {
        fetch('/api/advertisements/click', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adId: ad.id })
        }).catch(() => {});
        if (ad.actionUrl && ad.actionUrl.startsWith('tel:')) {
          window.location.href = ad.actionUrl;
        } else if (ad.actionUrl) {
          window.open(ad.actionUrl, '_blank');
        }
      }

      // Live In-App Driver Chat & Call Modal States
      const [showChatModal, setShowChatModal] = useState(false);
      const [showCallModal, setShowCallModal] = useState(false);
      const [chatMessages, setChatMessages] = useState([]);
      const [newChatMessage, setNewChatMessage] = useState('');

      // Device GPS state. Accuracy is always the value reported by the browser.
      const [gpsAccuracy, setGpsAccuracy] = useState(null);
      const [isRefiningGps, setIsRefiningGps] = useState(false);
      const [gpsError, setGpsError] = useState('');

      // Automated AI Care Agent States & Handler
      const [showAiChatModal, setShowAiChatModal] = useState(false);
      const [aiChatMessages, setAiChatMessages] = useState([
        { sender: 'bot', text: 'Hi! I am Vaayu AI Assistant 🤖. How can I help you with your booking today?' }
      ]);
      const [aiChatInput, setAiChatInput] = useState('');

      async function handleSendAiChat(queryText = null) {
        const textToSend = queryText || aiChatInput;
        if (!textToSend || !textToSend.trim()) return;

        const newMsgs = [...aiChatMessages, { sender: 'user', text: textToSend }];
        setAiChatMessages(newMsgs);
        setAiChatInput('');

        try {
          const res = await fetch('/api/support/ai-chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              query: textToSend,
              customerName: currentUser ? currentUser.name : senderName,
              customerPhone: currentUser ? currentUser.phone : senderPhone
            })
          });
          const data = await res.json();
          if (data.success) {
            setAiChatMessages([...newMsgs, { sender: 'bot', text: data.reply, escalated: data.escalated }]);
          }
        } catch(e) {
          setAiChatMessages([...newMsgs, { sender: 'bot', text: '🤖 Vaayu AI Agent is online. Type "agent" to connect to a human.' }]);
        }
      }

      function handleDeleteSavedAddress(id) {
        setSavedAddresses(savedAddresses.filter(a => a.id !== id));
      }

      // Fetch Chat Messages Handler
      async function fetchChatMessages(tripId) {
        try {
          const tid = tripId || activeTrip?.id;
          if (!tid) { setChatMessages([]); return; }
          const res = await fetch(`/api/chat/messages?tripId=${tid}`);
          const data = await res.json();
          if (data.success) {
            setChatMessages(data.messages);
          }
        } catch(e) {}
      }

      // Send Chat Message Handler
      async function handleSendChatMessage(textOverride) {
        const textToSend = textOverride || newChatMessage;
        if (!textToSend || !textToSend.trim()) return;
        const tid = activeTrip?.id;
        if (!tid) return;
        try {
          const res = await fetch('/api/chat/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tripId: tid,
              senderRole: 'CUSTOMER',
              senderName: currentUser ? currentUser.name : 'Customer',
              messageText: textToSend.trim()
            })
          });
          const data = await res.json();
          if (data.success) {
            setNewChatMessage('');
            fetchChatMessages(tid);
            setTimeout(() => fetchChatMessages(tid), 1600);
          }
        } catch(e) {}
      }



      // Send OTP Handler
      async function handleSendOtp(e) {
        if (e) e.preventDefault();
        setAuthError('');
        setIsLoading(true);
        const phoneToUse = authTab === 'SIGNUP' ? signupPhone : loginPhone;
        
        if (!phoneToUse || phoneToUse.replace(/\D/g, '').length < 10) {
          setAuthError('Please enter a valid 10-digit mobile number.');
          setIsLoading(false);
          return;
        }

        if (authTab === 'SIGNUP' && (!signupName || signupName.trim().length < 2)) {
          setAuthError('Please enter your full name.');
          setIsLoading(false);
          return;
        }

        try {
          const res = await fetch('/api/auth/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              phone: phoneToUse,
              isSignUp: authTab === 'SIGNUP',
              name: signupName
            })
          });
          const data = await res.json();
          if (data.success) {
            setActiveOtp(data.otp);
            setOtpMsg(data.message);
            setAuthStep('OTP');
            setOtpCode('');
            setOtpTimer(30);
          } else {
            setAuthError(typeof data.error === 'string' ? data.error : (data.error?.message || 'Failed to send OTP.'));
          }
        } catch (err) {
          setAuthError('Failed to send OTP. Please check backend connection.');
        } finally {
          setIsLoading(false);
        }
      }

      // Verify OTP Handler
      async function handleVerifyOtp(e) {
        if (e) e.preventDefault();
        setAuthError('');
        if (!otpCode || otpCode.trim().length < 4 || otpCode.trim().length > 6) {
          setAuthError('Please enter the 6-digit OTP code.');
          return;
        }
        setIsLoading(true);
        const phoneToUse = authTab === 'SIGNUP' ? signupPhone : loginPhone;

        try {
          const res = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              phone: phoneToUse,
              otp: otpCode,
              isSignUp: authTab === 'SIGNUP',
              name: signupName,
              email: signupEmail,
              city: signupCity
            })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            vaayuCustomerToken = data.token;
            sessionStorage.setItem('vaayu_customer_token', data.token);
            setCurrentUser(data.user);
            setSenderName(data.user.name);
            setSenderPhone(data.user.phone.replace('+91 ', ''));
            setWalletBalance(Number(data.user.walletBalance) || 0);
            setAuthStep('PHONE');
            fetchHistory();
          } else {
            setAuthError(typeof data.error === 'string' ? data.error : (data.error?.message || 'Invalid OTP PIN.'));
          }
        } catch (err) {
          setAuthError('OTP Verification error occurred.');
        } finally {
          setIsLoading(false);
        }
      }

      function handleLogout() {
        vaayuCustomerToken = null;
        sessionStorage.removeItem('vaayu_customer_token');
        setCurrentUser(null);
        setActiveTrip(null);
        setAuthError('');
        setIsSidebarOpen(false);
        setBookingStep('HOME');
      }

      // Fetch Trip History
      async function fetchHistory() {
        try {
          const res = await fetch('/api/trips/history');
          const data = await res.json();
          if (data.success) {
            setTripHistory(data.trips);
          }
        } catch (e) {}
      }

      useEffect(() => {
        let cancelled = false;
        const token = sessionStorage.getItem('vaayu_customer_token');
        if (!token) return () => { cancelled = true; };
        vaayuCustomerToken = token;
        fetch('/api/customer/profile').then(async response => {
          const data = await response.json();
          if (!response.ok || !data.success || !data.profile) throw new Error(data.error || 'Session expired');
          if (cancelled) return;
          setCurrentUser(data.profile);
          setSenderName(data.profile.name || 'Customer');
          setSenderPhone(String(data.profile.phone || '').replace(/\D/g, '').slice(-10));
          setWalletBalance(Number(data.profile.walletBalance) || 0);
          fetchHistory();
        }).catch(() => {
          if (!cancelled) {
            vaayuCustomerToken = null;
            sessionStorage.removeItem('vaayu_customer_token');
          }
        });
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        if (!currentUser || !activeTrip?.id || ['DELIVERED', 'COMPLETED', 'CANCELLED', 'FAILED'].includes(activeTrip.status)) return;
        let cancelled = false;
        const refreshTrip = async () => {
          try {
            const response = await fetch(`/api/trips/${encodeURIComponent(activeTrip.id)}`);
            const data = await response.json();
            if (!cancelled && response.ok && data.success && data.trip) {
              setActiveTrip(data.trip);
              setTripHistory(items => items.map(item => item.id === data.trip.id ? data.trip : item));
            }
          } catch (_) {}
        };
        const timer = window.setInterval(refreshTrip, 5000);
        return () => { cancelled = true; window.clearInterval(timer); };
      }, [currentUser?.id, activeTrip?.id, activeTrip?.status]);

      // Fuzzy & Distance-Aware Autocomplete Search with Ultra-Fast Response
      const searchPickupTimer = useRef(null);
      const searchDropTimer = useRef(null);

      function searchPickupAddress(query) {
        setPickupAddress(query);
        setPickupCoordinatesConfirmed(false);
        setGpsAccuracy(null);
        setGpsError('');
        if (!query || !query.trim()) {
          setPickupSearchResults([]);
          return;
        }

        if (searchPickupTimer.current) clearTimeout(searchPickupTimer.current);

        searchPickupTimer.current = setTimeout(async () => {
          try {
            const res = await fetch(`/api/geocoding/search?q=${encodeURIComponent(query.trim())}&refLat=${pickupCoords.lat}&refLng=${pickupCoords.lng}`);
            const data = await res.json();
            if (data.success) setPickupSearchResults(data.results);
          } catch (e) {}
        }, 80);
      }

      function selectPickupResult(item) {
        setPickupCoords({ lat: item.lat, lng: item.lng });
        setPickupAddress(item.name);
        setPickupCoordinatesConfirmed(!item.requiresPinConfirmation);
        setGpsAccuracy(null);
        setGpsError(item.requiresPinConfirmation
          ? 'This address is approximate. Move the pickup pin to the exact entrance before booking.'
          : '');
        setPickupSearchResults([]);
      }

      function searchDropAddress(query) {
        setDropAddress(query);
        if (!query || !query.trim()) {
          setDropSearchResults([]);
          return;
        }

        if (searchDropTimer.current) clearTimeout(searchDropTimer.current);

        searchDropTimer.current = setTimeout(async () => {
          try {
            const res = await fetch(`/api/geocoding/search?q=${encodeURIComponent(query.trim())}&refLat=${pickupCoords.lat}&refLng=${pickupCoords.lng}`);
            const data = await res.json();
            if (data.success) setDropSearchResults(data.results);
          } catch (e) {}
        }, 80);
      }

      function selectDropResult(item) {
        setDropCoords({ lat: item.lat, lng: item.lng });
        setDropAddress(item.name);
        setDropSearchResults([]);
      }

      async function reverseGeocode(lat, lng, target) {
        try {
          const res = await fetch(`/api/geocoding/reverse?lat=${lat}&lng=${lng}`);
          const data = await res.json();
          if (data.success) {
            if (target === 'PICKUP') setPickupAddress(data.address);
            if (target === 'DROP') setDropAddress(data.address);
            return data.address;
          }
        } catch (e) {}
        return null;
      }

      function handleUseCurrentGPS() {
        setGpsAccuracy(null);
        if (!window.isSecureContext) {
          setGpsError('Phone GPS requires a secure HTTPS page. Search for and select your pickup address instead.');
          return;
        }
        if (!navigator.geolocation) {
          setGpsError('This browser does not provide device location. Search for and select your pickup address instead.');
          return;
        }

        setGpsError('');
        setIsRefiningGps(true);
        let samples = [];
        let watchId = null;

        const finishLocation = (bestLat, bestLng, rawAcc) => {
          if (watchId !== null) navigator.geolocation.clearWatch(watchId);
          setIsRefiningGps(false);
          
          setGpsError('');
          setGpsAccuracy(Math.round(rawAcc * 10) / 10);
          setPickupCoords({ lat: bestLat, lng: bestLng });
          setPickupCoordinatesConfirmed(true);
          setPickupAddress('Current location');
          reverseGeocode(bestLat, bestLng, 'PICKUP');
          if (mapInstance.current) mapInstance.current.setView([bestLat, bestLng], 17);
        };

        const timeoutTimer = setTimeout(() => {
          if (samples.length > 0) {
            samples.sort((a, b) => a.acc - b.acc);
            const best = samples[0];
            finishLocation(best.lat, best.lng, best.acc);
          } else {
            setIsRefiningGps(false);
            setGpsError('Could not get a GPS fix. Check the phone location setting and browser permission, then retry or select an address.');
          }
        }, 9000);

        watchId = navigator.geolocation.watchPosition(
          pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const acc = Number(pos.coords.accuracy);
            if (!Number.isFinite(acc) || acc <= 0) return;
            
            samples.push({ lat, lng, acc });

            // Lock immediately if high precision sample <= 10m or after 3 samples
            if (acc <= 10.0 || samples.length >= 3) {
              clearTimeout(timeoutTimer);
              let totalWeight = 0;
              let weightedLat = 0;
              let weightedLng = 0;
              samples.forEach(s => {
                const weight = 1 / Math.max(0.5, s.acc);
                totalWeight += weight;
                weightedLat += s.lat * weight;
                weightedLng += s.lng * weight;
              });
              const finalLat = weightedLat / totalWeight;
              const finalLng = weightedLng / totalWeight;
              const minAcc = Math.min(...samples.map(s => s.acc));

              finishLocation(finalLat, finalLng, minAcc);
            }
          },
          err => {
            clearTimeout(timeoutTimer);
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            setIsRefiningGps(false);
            const reason = err.code === 1
              ? 'Location permission was denied. Allow location for this site in the phone browser settings, then retry.'
              : err.code === 2
                ? 'The phone could not determine its location. Check that device location is enabled, then retry.'
                : 'Getting the phone location timed out. Retry outdoors or select an address.';
            setGpsError(reason);
          },
          { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
        );
      }

      function handleSwapLocations() {
        const tempAddr = pickupAddress;
        const tempCoords = pickupCoords;
        setPickupAddress(dropAddress);
        setPickupCoords(dropCoords);
        setPickupCoordinatesConfirmed(Boolean(dropAddress.trim()));
        setDropAddress(tempAddr);
        setDropCoords(tempCoords);
        setPickupSearchResults([]);
        setDropSearchResults([]);
      }

      // Fetch Dynamic Route & Estimates
      async function fetchFareEstimates() {
        try {
          const res = await fetch('/api/trips/estimate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              pickupLat: pickupCoords.lat,
              pickupLng: pickupCoords.lng,
              dropLat: dropCoords.lat,
              dropLng: dropCoords.lng,
              intermediateStops: intermediateStops.map(s => ({ address: s.address, lat: s.lat, lng: s.lng })),
              helperCount,
              extraDropsCount,
              waitingTimeMinutes,
              isOutstation: bookingMode === 'OUTSTATION'
            })
          });
          const data = await res.json();
          if (data.success) {
            setEstimates(data.estimates);
            setRouteMetrics({ distanceKm: data.distanceKm, durationMin: data.durationMin, isDegraded: Boolean(data.isDegraded), routeProvider: data.routeProvider || null });
            updateMapPolyline(data.routePoints, data.isDegraded);
          }
        } catch (e) {}
      }

      // Handle Booking Creation
      async function handleCreateBooking() {
        if (!pickupCoordinatesConfirmed) {
          alert('Choose a pickup address from the suggestions or use device GPS before continuing. The map starting point is only a search anchor.');
          return;
        }
        const selectedEst = estimates.find(e => e.vehicleId === selectedVehicle) || estimates[0];
        const totalPayable = (selectedEst ? selectedEst.totalFare : 0) + driverTip;

        if (paymentMethod === 'WALLET' && walletBalance < totalPayable) {
          alert(`⚠️ Insufficient Wallet Balance!\n\nYour VAAYU Wallet balance is ₹${walletBalance}, but total payable trip amount is ₹${totalPayable}.\n\nPlease top up your wallet by ₹${totalPayable - walletBalance} or switch to UPI / Cash.`);
          return;
        }

        setIsDispatching(true);
        try {
          const res = await fetch('/api/trips/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              vehicleId: selectedVehicle,
              pickupAddress: pickupAddress || 'Pickup Location',
              pickupLat: pickupCoords.lat,
              pickupLng: pickupCoords.lng,
              dropAddress: dropAddress || 'Drop Location',
              dropLat: dropCoords.lat,
              dropLng: dropCoords.lng,
              intermediateStops: intermediateStops.map(s => ({ address: s.address, lat: s.lat, lng: s.lng })),
              senderName,
              senderPhone,
              receiverName,
              receiverPhone,
              helperCount,
              extraDropsCount,
              waitingTimeMinutes,
              driverTip,
              paymentMethod,
              isOutstation: bookingMode === 'OUTSTATION',
              goodsCategory,
              isFragile,
              goodsNotes,
              dispatchMode,
              scheduledDate,
              scheduledTimeSlot
            })
          });
          const data = await res.json();
          if (!res.ok || !data.success || !data.trip) throw new Error(typeof data.error === 'string' ? data.error : (data.error?.message || 'Booking could not be confirmed.'));
          if (mapInstance.current) {
            try { mapInstance.current.remove(); } catch(e) {}
            mapInstance.current = null;
          }
          setActiveTrip(data.trip);
          setTripHistory(prev => [data.trip, ...prev.filter(trip => trip.id !== data.trip.id)]);
          if (paymentMethod === 'WALLET') setWalletBalance(prev => Math.max(0, prev - data.trip.totalFare));
        } catch (e) {
          alert(e.message || 'Booking failed. Please try again.');
        } finally {
          setIsDispatching(false);
        }
      }

      function handleCopyOtp() {
        if (activeTrip) {
          navigator.clipboard.writeText(activeTrip.deliveryOtp);
          setCopiedOtp(true);
          setTimeout(() => setCopiedOtp(false), 2000);
        }
      }

      function handleShareWhatsApp() {
        if (activeTrip) {
          const driver = activeTrip.driver || {};
          const text = `Hi ${receiverName}, VAAYU truck (${activeTrip.vehicleName || 'delivery vehicle'}${driver.vehicleNumber ? ` - ${driver.vehicleNumber}` : ''}) is delivering your goods. Your 4-digit Delivery OTP PIN is: ${activeTrip.deliveryOtp}. Share this with the driver${driver.name ? ` ${driver.name}` : ''} upon arrival.`;
          window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        }
      }

      // Add Saved Address
      function handleAddSavedAddress(e) {
        e.preventDefault();
        if (!newAddrLabel || !newAddrText) return;
        const newAddr = {
          id: Date.now(),
          label: newAddrLabel,
          address: newAddrText,
          lat: pickupCoords.lat,
          lng: pickupCoords.lng
        };
        setSavedAddresses([...savedAddresses, newAddr]);
        setNewAddrLabel('');
        setNewAddrText('');
      }

      // Add Wallet Balance
      async function handleAddWalletMoney(amount) {
        const addVal = parseInt(amount, 10);
        if (isNaN(addVal) || addVal <= 0 || !currentUser) return;
        try {
          const response = await fetch('/api/customer/wallet/top-up', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: addVal, referenceId: `TOPUP_${currentUser.id}_${Date.now()}` })
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || 'Wallet top-up is unavailable.');
          setWalletBalance(Number(result.walletBalance) || 0);
          setWalletMsg(result.message || `₹${addVal} wallet balance added.`);
          setTimeout(() => setWalletMsg(''), 4000);
        } catch (error) {
          alert(error.message || 'Wallet top-up is unavailable.');
        }
      }

      // Leaflet Map Init & Multi-Stop Markers
      useEffect(() => {
        let isMounted = true;
        let timer = null;

        if (currentUser && currentView === 'BOOKING') {
          timer = setTimeout(() => {
            if (!isMounted) return;

            // Re-bind Leaflet map instance if container DOM element unmounted or changed
            if (mapInstance.current && mapRef.current) {
              const currentContainer = mapInstance.current.getContainer();
              if (currentContainer !== mapRef.current) {
                try { mapInstance.current.remove(); } catch(e) {}
                mapInstance.current = null;
              }
            }

            if (!mapInstance.current && mapRef.current) {
              mapInstance.current = L.map(mapRef.current).setView([pickupCoords.lat, pickupCoords.lng], 13);
              L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a> contributors'
              }).addTo(mapInstance.current);
            }

            if (mapInstance.current) {
              mapInstance.current.invalidateSize();

              // Clear old markers
              if (pickupMarkerRef.current) mapInstance.current.removeLayer(pickupMarkerRef.current);
              if (dropMarkerRef.current) mapInstance.current.removeLayer(dropMarkerRef.current);
              if (stopMarkersRef.current) {
                stopMarkersRef.current.forEach(m => mapInstance.current.removeLayer(m));
                stopMarkersRef.current = [];
              }

              // Display simulated nearby active fleet on HOME screen map (VEHICLE ONLY - NO BOX OVERLAY)
              if (bookingStep === 'HOME') {
                fetch(`/api/drivers/nearby?lat=${pickupCoords.lat}&lng=${pickupCoords.lng}&radiusKm=5`)
                  .then(r => r.json())
                  .then(data => {
                    if (!mapInstance.current || !data.success) return;
                    (data.drivers || []).forEach((d) => {
                      if (!Number.isFinite(d.lat) || !Number.isFinite(d.lng)) return;
                      const nm = L.marker([d.lat, d.lng], {
                        icon: L.divIcon({
                          html: `<div style="font-size: 28px; line-height: 1; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.6));">${d.vehicleIcon || '🚚'}</div>`,
                          className: 'clean-leaflet-icon',
                          iconSize: [32, 32],
                          iconAnchor: [16, 16]
                        })
                      }).addTo(mapInstance.current).bindPopup(`<strong>${d.vehicleName || 'VAAYU vehicle'}</strong>`);
                      stopMarkersRef.current.push(nm);
                    });
                  })
                  .catch(() => {});
              }

              // Pickup Marker (CLEAN GREEN PIN DOT - NO BULKY OVERLAY)
              pickupMarkerRef.current = L.marker([pickupCoords.lat, pickupCoords.lng], {
                draggable: true,
                icon: L.divIcon({
                  html: '<div style="background:#10b981; width:20px; height:20px; border-radius:50%; border:3px solid #ffffff; box-shadow:0 0 12px rgba(16,185,129,0.9), 0 3px 6px rgba(0,0,0,0.5);"></div>',
                  className: 'clean-leaflet-icon',
                  iconSize: [20, 20],
                  iconAnchor: [10, 10]
                })
              }).addTo(mapInstance.current).bindPopup(`Pickup: ${pickupAddress}`);

              pickupMarkerRef.current.on('dragend', (e) => {
                const pos = e.target.getLatLng();
                setPickupCoords({ lat: pos.lat, lng: pos.lng });
                setPickupCoordinatesConfirmed(true);
                setPickupAddress('Map pin location');
                reverseGeocode(pos.lat, pos.lng, 'PICKUP');
              });

              // Intermediate Stop Markers (CLEAN AMBER DOT)
              intermediateStops.forEach((stop, i) => {
                const stopM = L.marker([stop.lat, stop.lng], {
                  draggable: true,
                  icon: L.divIcon({
                    html: `<div style="background:#f59e0b; width:18px; height:18px; border-radius:50%; border:3px solid #ffffff; box-shadow:0 0 10px rgba(245,158,11,0.9), 0 3px 6px rgba(0,0,0,0.5);"></div>`,
                    className: 'clean-leaflet-icon',
                    iconSize: [18, 18],
                    iconAnchor: [9, 9]
                  })
                }).addTo(mapInstance.current).bindPopup(`Stop #${i+1}: ${stop.address || 'Intermediate Stop'}`);

                stopM.on('dragend', (e) => {
                  const pos = e.target.getLatLng();
                  setIntermediateStops(prev => prev.map(s => s.id === stop.id ? { ...s, lat: pos.lat, lng: pos.lng } : s));
                });
                stopMarkersRef.current.push(stopM);
              });

              // Drop Marker (CLEAN RED PIN DOT)
              if (dropAddress && dropAddress.trim()) {
                dropMarkerRef.current = L.marker([dropCoords.lat, dropCoords.lng], {
                  draggable: true,
                  icon: L.divIcon({
                    html: '<div style="background:#f43f5e; width:20px; height:20px; border-radius:50%; border:3px solid #ffffff; box-shadow:0 0 12px rgba(244,63,94,0.9), 0 3px 6px rgba(0,0,0,0.5);"></div>',
                    className: 'clean-leaflet-icon',
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                  })
                }).addTo(mapInstance.current).bindPopup(`Drop: ${dropAddress}`);

                dropMarkerRef.current.on('dragend', (e) => {
                  const pos = e.target.getLatLng();
                  setDropCoords({ lat: pos.lat, lng: pos.lng });
                  reverseGeocode(pos.lat, pos.lng, 'DROP');
                });
              }

              // Driver Partner Marker (VEHICLE ONLY)
              if (activeTrip && activeTrip.driver) {
                if (driverMarkerRef.current) mapInstance.current.removeLayer(driverMarkerRef.current);
                driverMarkerRef.current = L.marker([activeTrip.driver.currentLat, activeTrip.driver.currentLng], {
                  icon: L.divIcon({
                    html: `<div style="font-size: 32px; line-height: 1; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6)); cursor: pointer;">🚚</div>`,
                    className: 'clean-leaflet-icon',
                    iconSize: [34, 34],
                    iconAnchor: [17, 17]
                  })
                }).addTo(mapInstance.current).bindPopup(`Driver: ${activeTrip.driver.name} (${activeTrip.driver.vehicleNumber})`);
              }

              if (dropAddress && dropAddress.trim()) {
                fetchFareEstimates();
              }

              // Multi-stage invalidateSize pulses after DOM transition completes
              setTimeout(() => {
                if (mapInstance.current) mapInstance.current.invalidateSize();
              }, 150);
              setTimeout(() => {
                if (mapInstance.current) mapInstance.current.invalidateSize();
              }, 400);
            }
          }, 100);
        } else {
          if (mapInstance.current) {
            try { mapInstance.current.remove(); } catch(e) {}
            mapInstance.current = null;
          }
        }

        return () => {
          isMounted = false;
          if (timer) clearTimeout(timer);
        };
      }, [currentUser, currentView, bookingStep, activeTrip, pickupCoords, dropCoords, intermediateStops, helperCount, extraDropsCount, waitingTimeMinutes, bookingMode]);

      function updateMapPolyline(points, isDegraded = false) {
        if (!mapInstance.current) return;
        if (polylineRef.current) mapInstance.current.removeLayer(polylineRef.current);

        if (points && points.length) {
          polylineRef.current = window.VaayuMapEngine.renderGeometry(mapInstance.current, points, {
            color: '#06b6d4', isDegraded, weight: 5, padding: [50, 50]
          });
        }
      }

      // 1. ONBOARDING LOGIN / SIGN UP WITH OTP
      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
            <div className="max-w-md w-full bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
              
              <div className="text-center space-y-2">
                <div className="w-16 h-16 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center font-black text-slate-950 text-3xl shadow-cyan-500/30 shadow-xl mx-auto">
                  ⚡
                </div>
                <h1 className="text-3xl font-black text-white tracking-wider">VAAYU</h1>
                <p className="text-xs text-slate-400">Customer Goods Transport & Truck Booking</p>
                <p className="text-[11px] text-cyan-400 font-medium">Hyderabad & Custom Locations</p>
              </div>

              {/* STEP 1: ENTER MOBILE NUMBER */}
              {authStep === 'PHONE' && (
                <div className="space-y-5">
                  <div className="flex bg-slate-950 p-1.5 rounded-xl border border-slate-800">
                    <button type="button" onClick={() => { setAuthTab('SIGNUP'); setAuthError(''); }} className={`flex-1 py-2.5 rounded-lg text-xs font-bold transition ${authTab === 'SIGNUP' ? 'bg-cyan-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'}`}>
                      <i className="fa-solid fa-user-plus mr-1"></i> New User? Sign Up
                    </button>
                    <button type="button" onClick={() => { setAuthTab('LOGIN'); setAuthError(''); }} className={`flex-1 py-2.5 rounded-lg text-xs font-bold transition ${authTab === 'LOGIN' ? 'bg-cyan-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'}`}>
                      <i className="fa-solid fa-right-to-bracket mr-1"></i> Existing User Login
                    </button>
                  </div>

                  {authError && (
                    <div className="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-xs text-rose-400 font-medium flex items-center">
                      <i className="fa-solid fa-circle-exclamation mr-2 text-base"></i> {authError}
                    </div>
                  )}

                  {authTab === 'SIGNUP' && (
                    <form onSubmit={handleSendOtp} className="space-y-3.5">
                      <div>
                        <label className="text-xs font-semibold text-slate-400 block mb-1">FULL NAME</label>
                        <input type="text" value={signupName} onChange={(e) => setSignupName(e.target.value)} required className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-cyan-500" placeholder="e.g. Full name" />
                      </div>

                      <div>
                        <label className="text-xs font-semibold text-slate-400 block mb-1">MOBILE NUMBER</label>
                        <div className="flex">
                          <span className="px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-l-xl text-slate-400 text-sm font-mono flex items-center">+91</span>
                          <input type="text" value={signupPhone} onChange={(e) => setSignupPhone(e.target.value)} required className="flex-1 bg-slate-950 border border-slate-800 rounded-r-xl px-4 py-2.5 text-white font-mono text-sm focus:outline-none focus:border-cyan-500" placeholder="10-digit mobile number" />
                        </div>
                      </div>

                      <div>
                        <label className="text-xs font-semibold text-slate-400 block mb-1">EMAIL ADDRESS (OPTIONAL)</label>
                        <input type="email" value={signupEmail} onChange={(e) => setSignupEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-cyan-500" placeholder="suraj@example.com" />
                      </div>

                      <button type="submit" disabled={isLoading} className="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 hover:to-blue-400 text-slate-950 font-black rounded-xl text-base shadow-lg shadow-cyan-500/25 transition mt-2 flex items-center justify-center space-x-2">
                        <span>{isLoading ? 'SENDING OTP...' : 'GET OTP VERIFICATION CODE'}</span>
                        <i className="fa-solid fa-arrow-right"></i>
                      </button>
                    </form>
                  )}

                  {authTab === 'LOGIN' && (
                    <form onSubmit={handleSendOtp} className="space-y-4">
                      <div>
                        <label className="text-xs font-semibold text-slate-400 block mb-1">REGISTERED MOBILE NUMBER</label>
                        <div className="flex">
                          <span className="px-3 py-3 bg-slate-950 border border-slate-800 rounded-l-xl text-slate-400 text-sm font-mono flex items-center">+91</span>
                          <input type="text" value={loginPhone} onChange={(e) => setLoginPhone(e.target.value)} required className="flex-1 bg-slate-950 border border-slate-800 rounded-r-xl px-4 py-3 text-white font-mono text-sm focus:outline-none focus:border-cyan-500" placeholder="10-digit mobile number" />
                        </div>
                      </div>

                      <button type="submit" disabled={isLoading} className="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-400 hover:to-blue-400 text-slate-950 font-black rounded-xl text-base shadow-lg shadow-cyan-500/25 transition flex items-center justify-center space-x-2">
                        <span>{isLoading ? 'SENDING OTP...' : 'SEND OTP VERIFICATION CODE'}</span>
                        <i className="fa-solid fa-arrow-right"></i>
                      </button>
                    </form>
                  )}

                </div>
              )}

              {/* STEP 2: VERIFY OTP SCREEN */}
              {authStep === 'OTP' && (
                <div className="space-y-5">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <button onClick={() => { setAuthStep('PHONE'); setAuthError(''); }} className="text-xs font-bold text-cyan-400 hover:underline flex items-center">
                      <i className="fa-solid fa-arrow-left mr-1"></i> Change Mobile Number
                    </button>
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">OTP VERIFICATION</span>
                  </div>

                  <div className="text-center space-y-1">
                    <h3 className="font-bold text-white text-base">Enter 6-Digit Verification OTP</h3>
                    <p className="text-xs text-slate-400">
                      Verification code sent to <strong className="text-cyan-400 font-mono">+91 {authTab === 'SIGNUP' ? signupPhone : loginPhone}</strong>
                    </p>
                  </div>

                  
                  {activeOtp && (
                    <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-center space-y-1.5">
                      <div className="flex items-center justify-between px-1">
                        <span className="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">⚡ INCOMING SMS OTP</span>
                        <a href="/otp-inbox.html" target="_blank" className="text-[10px] text-cyan-400 hover:underline font-bold flex items-center gap-1">
                          <i className="fa-solid fa-tower-broadcast"></i> Live SMS Inbox
                        </a>
                      </div>
                      <strong className="text-3xl font-mono font-black text-emerald-400 tracking-widest block">{activeOtp}</strong>
                      <div className="flex items-center justify-center gap-2 pt-1">
                        <button 
                          type="button" 
                          onClick={() => setOtpCode(String(activeOtp))} 
                          className="px-3 py-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black rounded-lg transition active:scale-95 shadow">
                          <i className="fa-solid fa-wand-magic-sparkles mr-1"></i> 1-Tap Auto-Fill Code
                        </button>
                      </div>
                    </div>
                  )}

                  {authError && (
                    <div className="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-xs text-rose-400 font-medium flex items-center">
                      <i className="fa-solid fa-circle-exclamation mr-2 text-base"></i> {authError}
                    </div>
                  )}

                  <form onSubmit={handleVerifyOtp} className="space-y-4">
                    <div>
                      <label className="text-xs font-semibold text-slate-400 block mb-1 text-center">ENTER VERIFICATION PIN</label>
                      <input 
                        type="text" 
                        maxLength={6} 
                        value={otpCode} 
                        onChange={(e) => setOtpCode(e.target.value.replace(/\D/g, ''))} 
                        required 
                        autoFocus
                        className="w-full bg-slate-950 border-2 border-cyan-500/50 focus:border-cyan-400 rounded-2xl px-4 py-3 text-center text-3xl text-cyan-400 font-mono font-black tracking-widest focus:outline-none" 
                        placeholder="••••••" 
                      />
                    </div>

                    <button type="submit" disabled={isLoading} className="w-full py-4 bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-slate-950 font-black rounded-2xl text-base shadow-lg shadow-emerald-500/25 transition">
                      {isLoading ? 'VERIFYING OTP...' : 'VERIFY OTP & LOGIN ➔'}
                    </button>
                  </form>

                  <div className="flex items-center justify-between pt-2 border-t border-slate-800 text-xs">
                    <button type="button" onClick={handleSendOtp} className="text-slate-400 hover:text-white font-bold">
                      Didn't receive code? <span className="text-cyan-400 underline">Resend OTP</span>
                    </button>
                    <a href="/otp-inbox.html" target="_blank" className="text-emerald-400 hover:underline font-bold flex items-center gap-1">
                      <i className="fa-solid fa-envelope-open-text"></i> View SMS Inbox
                    </a>
                  </div>
                </div>
              )}

            </div>
          </div>
        );
      }

      const selectedEst = estimates.find(e => e.vehicleId === selectedVehicle) || estimates[0];

      // 2. MAIN CUSTOMER APPLICATION
      return (
        <div className="min-h-screen flex flex-col bg-slate-950 relative">
          
          {/* HEADER BAR */}
          <header className="bg-slate-900 border-b border-slate-800 px-4 sm:px-6 py-3.5 flex justify-between items-center shadow-xl z-[100] sticky top-0">
            {/* LOGO ON LEFT */}
            <div className="flex items-center space-x-2.5 cursor-pointer" onClick={() => { setCurrentView('BOOKING'); setBookingStep('HOME'); }}>
              <div className="w-9 h-9 bg-cyan-500 rounded-xl flex items-center justify-center font-black text-slate-950 text-lg shadow-cyan-500/30 shadow-lg">
                ⚡
              </div>
              <div>
                <h1 className="text-xl font-black text-white leading-none">VAAYU</h1>
                <p className="text-[10px] text-cyan-400 font-semibold tracking-wide">Customer Logistics App</p>
              </div>
            </div>

                        <span className="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 text-[9px] font-bold rounded block w-fit mt-1 border border-emerald-500/30">
                          🎧 ESCALATED TO HUMAN AGENT NEHA SHARMA
                        </span>
                      )}
                    </div>
                  </div>
                ))}
              </div>

              {/* QUICK ACTION CHIPS */}
              <div className="p-2 bg-slate-950 border-t border-slate-800 flex items-center space-x-1.5 overflow-x-auto no-scrollbar text-[10px]">
                <button onClick={() => handleSendAiChat('Where is my driver location?')} className="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 text-cyan-400 font-bold rounded-lg whitespace-nowrap border border-slate-800">
                  📍 Where is my driver?
                </button>
                <button onClick={() => handleSendAiChat('Helper charges and fare rates')} className="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold rounded-lg whitespace-nowrap border border-slate-800">
                  💰 Fare rates
                </button>
                <button onClick={() => handleSendAiChat('Connect me to human agent')} className="px-2.5 py-1 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 font-bold rounded-lg whitespace-nowrap border border-emerald-500/30">
                  🎧 Talk to Human Agent
                </button>
              </div>

              <div className="p-3 bg-slate-900 border-t border-slate-800 flex items-center space-x-2">
                <input
                  type="text"
                  value={aiChatInput}
                  onChange={(e) => setAiChatInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === 'Enter') handleSendAiChat(); }}
                  placeholder="Ask AI or type 'agent' for human..."
                  className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500"
                />
                <button onClick={() => handleSendAiChat()} className="px-3.5 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black rounded-xl text-xs transition">
                  Send
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    vaayuCustomerToken = sessionStorage.getItem('vaayu_customer_token');

    const container = document.getElementById('root');
    if (window.ReactDOM && typeof ReactDOM.createRoot === 'function') {
      const root = ReactDOM.createRoot(container);
      root.render(<CustomerApp />);
    } else if (window.ReactDOM && typeof ReactDOM.render === 'function') {
      ReactDOM.render(<CustomerApp />, container);
    }
  </script>
</body>
</html>
