<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAAYU Admin Operations Console — Role-Based Access Control Platform</title>

  <link rel="stylesheet" href="/built/tailwind.css"/>

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous" crossorigin></script>


  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    #admin-map { height: 100%; width: 100%; min-height: 440px; border-radius: 1.25rem; z-index: 1; }
    .leaflet-pane { z-index: 10 !important; }
    .leaflet-top, .leaflet-bottom { z-index: 20 !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <div id="admin-root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    let activeAdminToken = null;
    const originalFetch = window.fetch.bind(window);
    window.fetch = (input, init = {}) => {
      const requestUrl = typeof input === 'string' ? input : input.url;
      if (activeAdminToken && new URL(requestUrl, window.location.href).pathname.startsWith('/api/admin/')) {
        const headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
        headers.set('Authorization', `Bearer ${activeAdminToken}`);
        init = { ...init, headers };
      }
      return originalFetch(input, init);
    };
    function openAdminExport(path) {
      if (!activeAdminToken) return;
      originalFetch(path, { headers: { Authorization: `Bearer ${activeAdminToken}` } }).then(async response => {
        if (!response.ok) throw new Error(`Export failed (HTTP ${response.status}).`);
        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);
        const filename = response.headers.get('Content-Disposition')?.match(/filename="?([^";]+)"?/i)?.[1] || 'vaayu-export.csv';
        const anchor = document.createElement('a');
        anchor.href = objectUrl;
        anchor.download = filename;
        anchor.click();
        URL.revokeObjectURL(objectUrl);
      }).catch(error => alert(error.message || 'Could not download the export.'));
    }

    function AdminApp() {
      // Admin RBAC User Authentication State
      const [adminUser, setAdminUser] = useState(null);
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [selectedLoginRole, setSelectedLoginRole] = useState(null);
      const [loginError, setLoginError] = useState('');
      const [isAuthenticating, setIsAuthenticating] = useState(false);

      // Active Tab State (Auto-selects first allowed tab)
      const [activeTab, setActiveTab] = useState('ANALYTICS');

      // System Data States
      const [analyticsData, setAnalyticsData] = useState(null);
      const [trips, setTrips] = useState([]);
      const [drivers, setDrivers] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [vehicles, setVehicles] = useState([]);
      const [settings, setSettings] = useState({});
      const [tickets, setTickets] = useState([]);
      const [logs, setLogs] = useState([]);
      const [advertisements, setAdvertisements] = useState([]);
      const [zones, setZones] = useState([]);
      const [disputes, setDisputes] = useState([]);
      const [broadcasts, setBroadcasts] = useState([]);
      const [rejections, setRejections] = useState([]);
      const [payouts, setPayouts] = useState([]);
      const [kycDocs, setKycDocs] = useState([]);
      const [fleetLive, setFleetLive] = useState({ drivers: [], summary: {} });
      const [smsInbox, setSmsInbox] = useState([]);
      const [smsFilter, setSmsFilter] = useState('ALL');
      const [smsSearch, setSmsSearch] = useState('');

      // UI Control States
      const [isLoading, setIsLoading] = useState(false);
      const [selectedTripModal, setSelectedTripModal] = useState(null);
      const [selectedTicketModal, setSelectedTicketModal] = useState(null);
      const [selectedRejectionModal, setSelectedRejectionModal] = useState(null);
      const [selectedKycDocModal, setSelectedKycDocModal] = useState(null);
      const [kycDocumentPreviewUrl, setKycDocumentPreviewUrl] = useState(null);
      const [kycPreviewState, setKycPreviewState] = useState('idle');
      const [rejectionProofPreviewUrl, setRejectionProofPreviewUrl] = useState(null);
      const [rejectionProofPreviewState, setRejectionProofPreviewState] = useState('idle');
      const [ticketReplyText, setTicketReplyText] = useState('');
      const [pricingEditVehicle, setPricingEditVehicle] = useState(null);
      const [showAddAdModal, setShowAddAdModal] = useState(false);
      const [showAddZoneModal, setShowAddZoneModal] = useState(false);
      const [showAddBroadcastModal, setShowAddBroadcastModal] = useState(false);

      const mapRef = useRef(null);
      const mapInstance = useRef(null);
      const mapMarkers = useRef(null);

      useEffect(() => {
        let objectUrl = null;
        let cancelled = false;
        setKycDocumentPreviewUrl(null);
        if (selectedKycDocModal?.id && activeAdminToken) {
          setKycPreviewState('loading');
          originalFetch(`/api/documents/file?id=${encodeURIComponent(selectedKycDocModal.id)}`, {
            headers: { Authorization: `Bearer ${activeAdminToken}` }
          }).then(response => {
            if (!response.ok) throw new Error('Document preview unavailable');
            return response.blob();
          }).then(blob => {
            if (cancelled) return;
            objectUrl = URL.createObjectURL(blob);
            setKycDocumentPreviewUrl(objectUrl);
            setKycPreviewState('ready');
          }).catch(() => { if (!cancelled) setKycPreviewState('unavailable'); });
        } else {
          setKycPreviewState('unavailable');
        }
        return () => {
          cancelled = true;
          if (objectUrl) URL.revokeObjectURL(objectUrl);
        };
      }, [selectedKycDocModal?.id]);

      useEffect(() => {
        let objectUrl = null;
        let cancelled = false;
        setRejectionProofPreviewUrl(null);
        const storedUrl = selectedRejectionModal?.videoUrl;
        if (!storedUrl) {
          setRejectionProofPreviewState('unavailable');
        } else if (storedUrl.startsWith('/api/admin/rejections/proof?') && activeAdminToken) {
          setRejectionProofPreviewState('loading');
          originalFetch(storedUrl, { headers: { Authorization: `Bearer ${activeAdminToken}` } })
            .then(response => { if (!response.ok) throw new Error('Proof unavailable'); return response.blob(); })
            .then(blob => {
              if (cancelled) return;
              objectUrl = URL.createObjectURL(blob);
              setRejectionProofPreviewUrl(objectUrl);
              setRejectionProofPreviewState('ready');
            }).catch(() => { if (!cancelled) setRejectionProofPreviewState('unavailable'); });
        } else if (storedUrl.startsWith('/driver/uploads/rejection_proofs/')) {
          setRejectionProofPreviewUrl(storedUrl);
          setRejectionProofPreviewState('ready');
        } else {
          setRejectionProofPreviewState('unavailable');
        }
        return () => {
          cancelled = true;
          if (objectUrl) URL.revokeObjectURL(objectUrl);
        };
      }, [selectedRejectionModal?.id]);

      // Admin authentication is server-authoritative; no local fallback can create a privileged session.
      const handleAdminLogin = async (e, roleOverride = null, customEmail = null) => {
        if (e && e.preventDefault) e.preventDefault();
        setLoginError('');
        if (roleOverride) {
          setLoginEmail(customEmail || '');
          setSelectedLoginRole(roleOverride);
          setLoginPassword('');
          setLoginError('Account selected. Enter its configured password, then sign in.');
          return;
        }
        setIsAuthenticating(true);

        const emailToUse = customEmail || loginEmail || 'admin@vaayu.in';

        try {
          const baseUrl = (window.location.origin && window.location.origin !== 'null' && window.location.origin !== 'file://') 
            ? window.location.origin 
            : '';

          const res = await fetch(`${baseUrl}/api/admin/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: emailToUse,
              password: loginPassword,
              role: selectedLoginRole || undefined
            })
          });

          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          const data = await res.json();
          setIsAuthenticating(false);

          if (data.success) {
            activeAdminToken = data.token;
            setAdminUser(data.adminUser);
            if (data.adminUser.permissions && data.adminUser.permissions.length > 0) {
              setActiveTab(data.adminUser.permissions[0]);
            }
          } else {
            setLoginError(data.error || 'Authentication failed. Please check credentials.');
          }
        } catch (err) {
          setIsAuthenticating(false);
          setLoginError('Could not authenticate with the server. Check the server connection and configured credentials.');
        }
      };

      // Fetch system data once authenticated
      const refreshAdminData = async () => {
        if (!adminUser) return;
        setIsLoading(true);
        try {
          const baseUrl = (window.location.origin && window.location.origin !== 'null' && window.location.origin !== 'file://') 
            ? window.location.origin 
            : '';

          const [resAnalytics, resTrips, resDrivers, resCustomers, resVehicles, resSettings, resTickets, resLogs, resAds, resZones, resDisputes, resBroadcasts, resRejections, resPayouts, resKyc, resFleetLive, resSms] = await Promise.all([
            fetch(`${baseUrl}/api/admin/analytics`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/admin/trips`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/admin/drivers`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/admin/customers`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/vehicles`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/admin/settings`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/admin/support/tickets`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/admin/automations/logs`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/admin/advertisements`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/admin/zones`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/admin/disputes`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/admin/broadcasts`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/admin/rejections`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/admin/payouts`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/admin/kyc-audit`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/admin/fleet/live`).then(r => r.json()).catch(() => ({ success: false })),
            fetch(`${baseUrl}/api/admin/otp/requests`).then(r => r.json()).catch(() => ({ success: false }))
          ]);

          if (resAnalytics.success) setAnalyticsData(resAnalytics.analytics);
          if (resTrips.success) setTrips(resTrips.trips);
          if (resDrivers.success) setDrivers(resDrivers.drivers);
          if (resCustomers.success) setCustomers(resCustomers.customers);
          if (resVehicles.success) setVehicles(resVehicles.vehicles);
          if (resSettings.success) setSettings(resSettings.settings);
          if (resTickets.success) setTickets(resTickets.tickets);
          if (resLogs.success) setLogs(resLogs.logs);
          if (resAds.success) setAdvertisements(resAds.advertisements);
          if (resZones.success) setZones(resZones.zones);
          if (resDisputes.success) setDisputes(resDisputes.disputes);
          if (resBroadcasts.success) setBroadcasts(resBroadcasts.broadcasts);
          if (resRejections.success) setRejections(resRejections.rejections || []);
          if (resPayouts.success) setPayouts(resPayouts.payouts || []);
          if (resKyc.success) setKycDocs(resKyc.documents || []);
          if (resFleetLive.success) setFleetLive({ drivers: resFleetLive.drivers || resFleetLive.fleet || [], summary: resFleetLive.summary || {} });
          if (resSms && resSms.success) {
            const normalizedSms = (resSms.requests || []).map(r => ({
              id: r.id,
              phone: r.maskedPhone || r.phone,
              appType: r.app,
              code: r.code || '••••••',
              status: r.status === 'PENDING' ? 'ACTIVE' : r.status,
              remainingSeconds: r.remainingSeconds || 0,
              createdAt: r.createdAt
            }));
            setSmsInbox(normalizedSms);
          }
        } catch (e) {
          console.error('Failed to load admin data:', e);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        if (adminUser) {
          refreshAdminData();
          const interval = setInterval(() => { if (!document.hidden) refreshAdminData(); }, 5000);
          return () => clearInterval(interval);
        }
      }, [adminUser]);

      // Leaflet Map Initialization for Dispatch Tower. Only actual GPS telemetry is plotted.
      useEffect(() => {
        if (!adminUser || activeTab !== 'DISPATCH' || !mapRef.current) {
          if (mapInstance.current) mapInstance.current.remove();
          mapInstance.current = null;
          mapMarkers.current = null;
          return;
        }
        if (mapInstance.current && mapInstance.current.getContainer() !== mapRef.current) {
          mapInstance.current.remove();
          mapInstance.current = null;
          mapMarkers.current = null;
        }
        if (!mapInstance.current) {
          mapInstance.current = L.map(mapRef.current).setView([17.4401, 78.3489], 12);
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a> contributors'
          }).addTo(mapInstance.current);
          mapMarkers.current = L.layerGroup().addTo(mapInstance.current);
        }

        if (adminUser && activeTab === 'DISPATCH' && mapInstance.current) {
          mapInstance.current.invalidateSize();
          mapMarkers.current?.clearLayers();
          (fleetLive.drivers || []).forEach(driver => {
            const lat = driver.lat == null || driver.lat === '' ? NaN : Number(driver.lat);
            const lng = driver.lng == null || driver.lng === '' ? NaN : Number(driver.lng);
            if (driver.locationSource !== 'GPS_TELEMETRY' || !Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return;
            L.marker([Number(driver.lat), Number(driver.lng)], {
              icon: L.divIcon({
                html: `<div style="background:#06b6d4; color:#020617; font-weight:bold; font-size:10px; padding:3px 6px; border-radius:10px; border:2px solid #fff;">🚚 ${String(driver.name || 'Driver').split(' ')[0]}</div>`,
                className: ''
              })
            }).addTo(mapMarkers.current).bindPopup(`Driver: ${driver.name || driver.driverId} · ${driver.speed ?? '—'} km/h · ${driver.livenessState}`);
          });
        }
      }, [adminUser, activeTab, fleetLive]);

      const performAdminAction = async (path, data) => {
        try {
          const response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || result.success === false) throw new Error(result.error?.message || result.error || `Request failed (HTTP ${response.status}).`);
          return true;
        } catch (error) {
          alert(error.message || 'Admin action failed.');
          return false;
        }
      };

      // Action Handlers
      const handleUpdateKyc = async (driverId, kycStatus) => {
        if (!hasPermission('DRIVERS')) return alert('Driver management permission is required.');
        if (await performAdminAction('/api/admin/drivers/update-kyc', { driverId, kycStatus })) refreshAdminData();
      };
      const [driverApplications, setDriverApplications] = useState([]);
      const [applicationNotes, setApplicationNotes] = useState({});
      const loadDriverApplications = async () => {
        if (!activeAdminToken || !hasPermission('DRIVERS')) return;
        try {
          const response = await originalFetch('/api/admin/driver-applications?status=PENDING', { headers: { Authorization: `Bearer ${activeAdminToken}` } });
          const data = await response.json();
          if (response.ok && data.success) setDriverApplications(data.applications || []);
        } catch (_) {}
      };
      const handleApplicationDecision = async (applicationId, decision) => {
        if (!hasPermission('DRIVERS')) return alert('Driver management permission is required.');
        const note = (applicationNotes[applicationId] || '').trim();
        if (decision === 'REJECT' && !note) return alert('Add a reason so the applicant knows why. It is shown to them on sign-in.');
        if (!confirm(decision === 'APPROVE' ? 'Approve this application? It creates an OFFLINE driver with KYC pending.' : 'Reject this application?')) return;
        if (await performAdminAction(`/api/admin/driver-applications/${encodeURIComponent(applicationId)}/decision`, { decision, note })) {
          loadDriverApplications();
          refreshAdminData();
        }
      };
      useEffect(() => { loadDriverApplications(); }, [activeTab, adminUser]);
      const handleUpdateDriverStatus = async (driverId, status) => {
        if (!hasPermission('DRIVERS')) return alert('Driver management permission is required.');
        if (await performAdminAction('/api/admin/drivers/update-status', { driverId, status })) refreshAdminData();
      };
      const handleUpdateTripStatus = async (tripId, status) => {
        if (!confirm(`Change trip ${tripId} to ${status.replaceAll('_', ' ')}?`)) return;
        if (await performAdminAction('/api/admin/trips/update-status', { tripId, status })) { setSelectedTripModal(null); refreshAdminData(); }
      };
      const handleSavePricing = async (vehicleId, pricingData) => {
        if (!hasPermission('PRICING')) return alert('Pricing permission is required.');
        if (await performAdminAction('/api/admin/pricing/update', { vehicleId, ...pricingData })) { setPricingEditVehicle(null); refreshAdminData(); }
      };
      const handleToggleMaintenance = async () => {
        if (adminUser.role !== 'SUPER_ADMIN') return alert('Only a Super Admin can toggle maintenance mode.');
        if (await performAdminAction('/api/admin/settings/update', { maintenanceMode: !settings.maintenanceMode })) refreshAdminData();
      };
      const handleUpdateSurge = async (surgeMultiplier) => {
        if (!hasPermission('PRICING')) return alert('Pricing permission is required.');
        if (await performAdminAction('/api/admin/settings/update', { surgeMultiplier })) refreshAdminData();
      };
      const handleReplyTicket = async (ticketId) => {
        if (!ticketReplyText.trim()) return;
        if (await performAdminAction('/api/admin/support/update', { ticketId, reply: ticketReplyText, status: 'RESOLVED', assignedAgent: adminUser.name })) { setTicketReplyText(''); setSelectedTicketModal(null); refreshAdminData(); }
      };
      const handleCreateAd = async adData => { if (await performAdminAction('/api/admin/advertisements/create', adData)) { setShowAddAdModal(false); refreshAdminData(); } };
      const handleToggleAdStatus = async (adId, currentStatus) => { if (await performAdminAction('/api/admin/advertisements/update-status', { adId, status: currentStatus === 'ACTIVE' ? 'PAUSED' : 'ACTIVE' })) refreshAdminData(); };
      const handleDeleteAd = async adId => { if (confirm('Are you sure you want to delete this business advertisement banner?') && await performAdminAction('/api/admin/advertisements/delete', { adId })) refreshAdminData(); };
      const handleUpdateZoneSurge = async (zoneId, surgeMultiplier) => { if (await performAdminAction('/api/admin/zones/update-surge', { zoneId, surgeMultiplier })) refreshAdminData(); };
      const handleToggleZoneStatus = async (zoneId, currentStatus) => { if (await performAdminAction('/api/admin/zones/toggle-status', { zoneId, status: currentStatus === 'ACTIVE' ? 'RESTRICTED' : 'ACTIVE' })) refreshAdminData(); };
      const handleCreateZone = async zoneData => { if (await performAdminAction('/api/admin/zones/create', zoneData)) { setShowAddZoneModal(false); refreshAdminData(); } };
      const handleReviewRejection = async (rejectionId, action, notes) => { if (await performAdminAction('/api/admin/rejections/update', { rejectionId, action, notes })) { setSelectedRejectionModal(null); refreshAdminData(); } };
      const handleApprovePayout = async (payoutId, action, notes) => { if (await performAdminAction('/api/admin/payouts/approve', { payoutId, action, notes })) refreshAdminData(); };
      const handleResolveDispute = async (disputeId, action, amount = 0, notes = '') => { if (await performAdminAction('/api/admin/disputes/resolve', { disputeId, action, amount, resolvedBy: adminUser.name, notes })) refreshAdminData(); };
      const handleSendBroadcast = async broadcastData => { if (await performAdminAction('/api/admin/broadcasts/send', broadcastData)) { setShowAddBroadcastModal(false); refreshAdminData(); } };
      const handleWalletCredit = async customer => {
        const amount = window.prompt(`Enter wallet credit for ${customer.name} (₹0.01–₹5,000):`);
        if (amount === null) return;
        const reason = window.prompt('Reason for this wallet credit:');
        if (reason === null) return;
        if (await performAdminAction('/api/admin/customers/wallet-credit', { customerId: customer.id, amount, reason })) refreshAdminData();
      };

      // Helper check if tab permission is granted
      const hasPermission = (tabId) => {
        if (!adminUser) return false;
        if (adminUser.role === 'SUPER_ADMIN') return true;
        return adminUser.permissions && adminUser.permissions.includes(tabId);
      };
      const liveDriverRows = fleetLive.drivers || [];
      const liveDriverById = new Map(liveDriverRows.map(d => [String(d.driverId), d]));
      const telemetryOnlineCount = Number(fleetLive.summary?.onlineCount || 0);
      const telemetrySpeeds = liveDriverRows.map(d => Number(d.speed)).filter(speed => Number.isFinite(speed));
      const telemetryAverageSpeed = telemetrySpeeds.length ? (telemetrySpeeds.reduce((sum, speed) => sum + speed, 0) / telemetrySpeeds.length).toFixed(1) : '—';
      const batchTrips = trips.filter(t => t.batchId);
      const batchGroups = Object.values(batchTrips.reduce((groups, trip) => { const id = String(trip.batchId); (groups[id] ||= []).push(trip); return groups; }, {})).filter(group => group.length > 1);
      const revenueHours = Array.from({ length: 12 }, (_, index) => {
        const start = new Date(); start.setUTCMinutes(0, 0, 0); start.setUTCHours(start.getUTCHours() - (11 - index));
        const end = new Date(start.getTime() + 3600000);
        const revenue = trips.reduce((sum, trip) => {
          const createdAt = Date.parse(trip.createdAt || trip.requestedAt || '');
          return createdAt >= start.getTime() && createdAt < end.getTime() ? sum + (Number(trip.totalFare) || 0) : sum;
        }, 0);
        return { label: `${String(start.getUTCHours()).padStart(2, '0')}:00`, revenue };
      });
      const maxHourlyRevenue = Math.max(...revenueHours.map(hour => hour.revenue), 1);
      const vehicleTripCounts = vehicles.map(vehicle => ({ ...vehicle, tripCount: trips.filter(trip => trip.vehicleId === vehicle.id).length }));
      const maxVehicleTripCount = Math.max(...vehicleTripCounts.map(vehicle => vehicle.tripCount), 1);

      // -------------------------------------------------------------------
      // 1. ADMIN LOGIN GATE (IF NOT AUTHENTICATED)
      // -------------------------------------------------------------------
      if (!adminUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
            <div className="max-w-xl w-full bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
              
              <div className="text-center space-y-2">
                <div className="w-16 h-16 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center font-black text-slate-950 text-3xl shadow-cyan-500/30 shadow-xl mx-auto">
                  🛡️
                </div>

                  <p className="text-emerald-400 font-bold">Recorded OCR Confidence: {Number.isFinite(Number(selectedKycDocModal.confidenceScore)) ? `${selectedKycDocModal.confidenceScore}%` : 'Not scored'}</p>
                  <p className="text-slate-400">Verifier on Record: {selectedKycDocModal.verifiedBy || 'Not recorded'}</p>
                  <p className="text-slate-400">Uploaded At: {selectedKycDocModal.uploadedAt ? new Date(selectedKycDocModal.uploadedAt).toLocaleString() : 'Not recorded'}</p>
                </div>

                <button onClick={() => setSelectedKycDocModal(null)} className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs transition">
                  Close Inspection Window
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('admin-root')).render(<AdminApp />);
  </script>
</body>
</html>
