<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAAYU Live Delivery Tracking</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Leaflet CSS & JS CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/map-engine.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #090d16; }
    .leaflet-container { background: #090d16 !important; font-family: inherit; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

  <div id="public-track-root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function PublicTrackApp() {
      const [trip, setTrip] = useState(null);
      const [loading, setLoading] = useState(true);
      const mapRef = useRef(null);

      // Public shipment details are available only through an unguessable tracking token.
      const urlParams = new URLSearchParams(window.location.search);
      const trackingToken = urlParams.get('token') || '';

      useEffect(() => {
        if (!trackingToken) {
          setLoading(false);
          return;
        }
        fetch(`/api/public/tracking/${encodeURIComponent(trackingToken)}`)
          .then(r => r.json())
          .then(data => {
            if (data?.success && data.trip) setTrip(data.trip);
          })
          .catch(() => {})
          .finally(() => setLoading(false));
      }, [trackingToken]);

      const mockTrip = trip || {
        id: '', goodsDesc: '', pickupAddress: '', dropAddress: '', driverName: '', driverPhone: '',
        vehicleName: '', vehicleNumber: '', status: trackingToken ? 'NOT_FOUND' : 'LINK_REQUIRED', etaMinutes: null,
        podSignature: '', podPhotos: []
      };

      // Initialize Leaflet Live Tracking Map
      useEffect(() => {
        if (window.L && trip && !mapRef.current) {
          setTimeout(() => {
            const container = document.getElementById('public-map-container');
            if (container) {
              const pickup = [Number(trip.pickupLat), Number(trip.pickupLng)];
              const drop = [Number(trip.dropLat), Number(trip.dropLng)];
              const driver = [Number(trip.driverLat), Number(trip.driverLng)];
              const driverHasLocation = Number.isFinite(driver[0]) && Number.isFinite(driver[1]);
              const map = L.map('public-map-container', { zoomControl: false }).setView(pickup, 13);
              
              L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                maxZoom: 19
              }).addTo(map);

              // Pickup Pin
              const pIcon = L.divIcon({
                html: '<div style="font-size:24px;">📍</div>',
                className: 'pickup-pin'
              });
              L.marker(pickup, { icon: pIcon }).addTo(map).bindPopup(`<b>Pickup: ${trip.pickupAddress}</b>`);

              // Drop Pin
              const dIcon = L.divIcon({
                html: '<div style="font-size:24px;">🎯</div>',
                className: 'drop-pin'
              });
              L.marker(drop, { icon: dIcon }).addTo(map).bindPopup(`<b>Destination: ${trip.dropAddress}</b>`);

              // Moving Truck Icon
              const truckIcon = L.divIcon({
                html: '<div style="font-size:28px; filter: drop-shadow(0 0 10px #f59e0b);">🚚</div>',
                className: 'truck-pin'
              });
              if (driverHasLocation) L.marker(driver, { icon: truckIcon }).addTo(map).bindPopup(`<b>Live Driver: ${trip.driverName}</b>`);

              // Draw the planned shipment route; show the driver's live marker separately.
              window.VaayuMapEngine.drawRoute(map, [pickup, drop], {
                color: '#f59e0b', weight: 5, fitBounds: false
              }).catch(() => {});
              map.fitBounds(driverHasLocation ? [pickup, driver, drop] : [pickup, drop], { padding: [24, 24] });

              mapRef.current = map;
            }
          }, 150);
        }
      }, [trip]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100 max-w-md mx-auto border-x border-slate-800 shadow-2xl">
          
          {/* HEADER */}
          <header className="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center sticky top-0 z-50">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 bg-amber-500 rounded-2xl flex items-center justify-center font-black text-slate-950 text-lg shadow-lg shadow-amber-500/20">
                🚚
              </div>
              <div>
                <h1 className="text-sm font-black text-white tracking-tight">VAAYU Live Tracking</h1>
                <p className="text-[11px] text-amber-400 font-bold">{mockTrip.senderName || 'Shipment status'}</p>
              </div>
            </div>
            <span className="text-[10px] bg-emerald-500/10 text-emerald-400 font-extrabold px-2.5 py-1 rounded-full border border-emerald-500/30 uppercase tracking-widest flex items-center space-x-1">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span>LIVE</span>
            </span>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 space-y-4 p-4">
            {!trip && <div role="alert" className="bg-slate-900 border border-amber-500/30 rounded-2xl p-4 text-sm text-slate-300">{loading ? 'Loading shipment status…' : (trackingToken ? 'This tracking link is invalid or expired.' : 'Open the private tracking link shared by the sender.')}</div>}
            
            {/* LIVE MAP */}
            <div className="bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden relative shadow-2xl">
              <div id="public-map-container" className="h-64 w-full"></div>
              <div className="absolute top-3 left-3 bg-slate-950/90 backdrop-blur-md px-3 py-1.5 rounded-xl border border-slate-800 text-[11px] font-bold text-amber-400 shadow-lg">
                ⏱️ Estimated Arrival: {mockTrip.etaMinutes} mins
              </div>
            </div>

            {/* STATUS BANNER */}
            <div className="bg-slate-900 p-4 rounded-3xl border border-amber-500/30 space-y-3 shadow-xl">
              <div className="flex justify-between items-center">
                <span className="text-[10px] text-slate-400 font-mono uppercase font-bold">TRIP #{mockTrip.id}</span>
                <span className="text-xs bg-amber-500 text-slate-950 font-black px-3 py-1 rounded-full uppercase">
                  {mockTrip.status || 'STATUS'}
                </span>
              </div>
              <h2 className="text-base font-black text-white">{mockTrip.goodsDesc}</h2>
              <div className="text-xs text-slate-300 space-y-1 pt-1 border-t border-slate-800">
                <div className="flex items-center space-x-2">
                  <span>📍 Pickup:</span>
                  <span className="text-slate-400">{mockTrip.pickupAddress}</span>
                </div>
                <div className="flex items-center space-x-2">
                  <span>🎯 Drop:</span>
                  <span className="text-cyan-400 font-semibold">{mockTrip.dropAddress}</span>
                </div>
              </div>
            </div>

            {/* DRIVER INFO CARD */}
            <div className="bg-slate-900 p-4 rounded-3xl border border-slate-800 flex items-center justify-between shadow-xl">
              <div className="flex items-center space-x-3">
                <div className="w-12 h-12 bg-slate-800 rounded-2xl flex items-center justify-center text-xl font-bold text-amber-400 border border-slate-700">
                  👤
                </div>
                <div>
                  <h3 className="font-bold text-white text-sm">{mockTrip.driverName}</h3>
                  <p className="text-xs text-slate-400 font-mono">{mockTrip.vehicleName} • {mockTrip.vehicleNumber}</p>
                </div>
              </div>
              <a href={`tel:${mockTrip.driverPhone}`} className="px-4 py-2.5 bg-emerald-500 text-slate-950 font-black rounded-2xl text-xs flex items-center space-x-1.5 shadow-lg shadow-emerald-500/20">
                <i className="fa-solid fa-phone"></i>
                <span>Call Driver</span>
              </a>
            </div>

          </main>

          {/* FOOTER BRANDING */}
          <footer className="p-4 text-center border-t border-slate-900 text-slate-600 text-[11px] font-semibold">
            Powered by VAAYU Commercial Logistics Network • Safe & Insured
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('public-track-root')).render(<PublicTrackApp />);
  </script>
</body>
</html>
