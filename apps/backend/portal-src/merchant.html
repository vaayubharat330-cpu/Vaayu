<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAAYU Enterprise Portal — Operations & Booking</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@8.0.7/babel.min.js" integrity="sha384-oO1UkcqdSTjrtWIjKpx1K6eE5I0WAXPWoezFn46CIHNoN6+CGVMK+GNSaDdkJ+u5" crossorigin="anonymous"></script>
  <!-- Leaflet CSS & JS CDN (Standalone Maps) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
  <script src="/map-engine.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    .leaflet-container { background: #090d16 !important; font-family: inherit; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

  <div id="merchant-root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    let vaayuMerchantToken = null;
    try { vaayuMerchantToken = sessionStorage.getItem('vaayu_merchant_token'); } catch (_) {}
    const nativeMerchantFetch = window.fetch.bind(window);
    window.fetch = (input, init = {}) => {
      const requestUrl = typeof input === 'string' ? input : input.url;
      const requestPath = new URL(requestUrl, window.location.href).pathname;
      if (vaayuMerchantToken && (requestPath.startsWith('/api/merchant/') || requestPath.startsWith('/api/support/'))) {
        const headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
        headers.set('Authorization', `Bearer ${vaayuMerchantToken}`);
        init = { ...init, headers };
      }
      return nativeMerchantFetch(input, init);
    };

    const defaultMerchant = {
      id: '',
      businessName: '',
      contactName: '',
      phone: '',
      category: '',
      gstin: '',
      city: '',
      address: ''
    };

    const defaultSavedLocations = [];

    const initialVehicles = [
      { id: 'v_ace', name: 'VAAYU Ace (Tata Ace 7ft)', cap: '750 kg', icon: '🚚', fare: 350, desc: 'Suitable for furniture, boxes & retail goods' },
      { id: 'v_pickup_8ft', name: 'VAAYU Pickup (8ft Bolero)', cap: '1200 kg', icon: '🚛', fare: 450, desc: 'Heavy hardware, construction materials & machinery' },
      { id: 'v_3w', name: 'VAAYU 3W Auto (Piaggio Ape)', cap: '500 kg', icon: '🛺', fare: 250, desc: 'Express commercial deliveries & Kirana restock' },
      { id: 'v_14ft', name: 'VAAYU 14ft Truck (3.5T)', cap: '3500 kg', icon: '🚛', fare: 850, desc: 'Full bulk warehouse transfers & heavy industrial loads' }
    ];

    function formatHumanStatus(status) {
      switch (status) {
        case 'CREATED':
        case 'SEARCHING_DRIVER':
          return '🔎 Matching nearby driver...';
        case 'DRIVER_ASSIGNED':
          return '🚚 Driver assigned';
        case 'DRIVER_ACCEPTED':
          return '🚚 Driver heading to pickup';
        case 'DRIVER_ARRIVING':
          return '🚚 Driver arriving at pickup';
        case 'DRIVER_AT_PICKUP':
          return '📍 Driver arrived at pickup location';
        case 'PICKUP_CONFIRMED':
          return '📦 Goods loaded & pickup verified';
        case 'IN_TRANSIT':
          return '🚚 On the way to destination';
        case 'DRIVER_AT_DROPOFF':
          return '🎯 Driver arrived at drop location';
        case 'DELIVERED':
        case 'COMPLETED':
          return '✅ Delivered successfully';
        case 'CANCELLED':
          return '❌ Delivery cancelled';
        default:
          return '🚚 Delivery in progress';
      }
    }

    function EnterprisePortalApp() {
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'new-booking', 'deliveries', 'schedule', 'account'
      const [merchant, setMerchant] = useState(defaultMerchant);
      const [savedLocations, setSavedLocations] = useState(defaultSavedLocations);

      // Dedicated Booking Workspace State (3 Steps)
      const [bookingStep, setBookingStep] = useState(1);
      const [pickupLoc, setPickupLoc] = useState(defaultSavedLocations[0]?.address || '');
      const [dropLoc, setDropLoc] = useState(defaultSavedLocations[1]?.address || '');
      const [pickupCoords, setPickupCoords] = useState({ lat: 17.4850, lng: 78.4041 });
      const [dropCoords, setDropCoords] = useState({ lat: 17.4401, lng: 78.3489 });

      const [selectedCategory, setSelectedCategory] = useState('Furniture');
      const [goodsDesc, setGoodsDesc] = useState('Sofa Set & Hardware Goods');
      const [weightKg, setWeightKg] = useState('350');
      const [packageCount, setPackageCount] = useState('6');
      const [instructions, setInstructions] = useState('Call customer before arrival');
      
      // Feature 5: Helper / Labor Request & Floor Details State
      const [helperCount, setHelperCount] = useState(1); // 0, 1 (+₹200), 2 (+₹400)
      const [hasElevator, setHasElevator] = useState(true);
      const [floorLevel, setFloorLevel] = useState('1st–3rd Floor');

      // Feature 1: Delivery Templates State
      const [templatesList, setTemplatesList] = useState([]);

      // Feature 2: Saved Customers Manager State
      const [savedCustomers, setSavedCustomers] = useState([]);
      const [selectedSavedCustomer, setSelectedSavedCustomer] = useState('');

      // Feature 3 & 8: Business Order ID, PO Reference & SLA Target State
      const [businessOrderId, setBusinessOrderId] = useState('');
      const [poReference, setPoReference] = useState('');
      const [requiredSlaTime, setRequiredSlaTime] = useState('17:00');

      // Feature 4: Advanced Search & Multi-Filter Query
      const [searchQuery, setSearchQuery] = useState('');

      // Feature 5: Multi-Branch Selector State
      const [selectedBranch, setSelectedBranch] = useState('All Branches');

      // Feature 12: Dispute / Support Issue Modal State
      const [disputeModalOrder, setDisputeModalOrder] = useState(null);
      const [disputeReason, setDisputeReason] = useState('Package Damaged');
      const [disputeNotes, setDisputeNotes] = useState('');
      const [disputeSuccessMsg, setDisputeSuccessMsg] = useState('');
      const [merchantActionError, setMerchantActionError] = useState('');

      const [vehicleCounts, setVehicleCounts] = useState({});

      // Feature 4: Sub-Account Staff Members State
      const [staffList, setStaffList] = useState([]);
      const [showAddStaffModal, setShowAddStaffModal] = useState(false);
      const [newStaffName, setNewStaffName] = useState('');
      const [newStaffPhone, setNewStaffPhone] = useState('');
      const [newStaffRole, setNewStaffRole] = useState('STORE_MANAGER');
      const [newStaffBranch, setNewStaffBranch] = useState('Kukatpally Depot');

      // Feature 3: Live Customer WhatsApp / Link Share Notification State
      const [copiedTrackMsg, setCopiedTrackMsg] = useState('');

      // B2B Enterprise Login & Registration Auth State
      const [authMode, setAuthMode] = useState('LOGIN'); // 'LOGIN', 'REGISTER', 'AUTHENTICATED'
      const [authPhone, setAuthPhone] = useState('');
      const [otpSent, setOtpSent] = useState(false);
      const [otpCode, setOtpCode] = useState('');
      const [authError, setAuthError] = useState('');
      const [isAuthSubmitting, setIsAuthSubmitting] = useState(false);

      // Registration Form State
      const [regBusinessName, setRegBusinessName] = useState('');
      const [regContactName, setRegContactName] = useState('');
      const [regPhone, setRegPhone] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regCategory, setRegCategory] = useState('Furniture & Interior Supplies');
      const [regAddress, setRegAddress] = useState('');
      const [regGstin, setRegGstin] = useState('');
      const [regOtpSent, setRegOtpSent] = useState(false);
      const [regOtpCode, setRegOtpCode] = useState('');

      // Bulk Excel Import Side Panel State
      const [showExcelPanel, setShowExcelPanel] = useState(false);
      const [excelInput, setExcelInput] = useState("")
      const [excelValidation, setExcelValidation] = useState(null);

      const [isBookingSubmitting, setIsBookingSubmitting] = useState(false);
      const [bookingSuccessMsg, setBookingSuccessMsg] = useState('');

      // Operational Dashboard & Deliveries Tab State
      const [ordersData, setOrdersData] = useState([]);
      const [ordersFilter, setOrdersFilter] = useState('ALL');
      const [trackingModalOrder, setTrackingModalOrder] = useState(null);
      const [selectedTrackingDriverIndex, setSelectedTrackingDriverIndex] = useState(0);

      // Schedule & SLA State
      const [schedulesList, setSchedulesList] = useState([]);
      const [slaMetrics, setSlaMetrics] = useState({
        slaComplianceRate: 0,
        onTimePickupRate: 0,
        onTimeDeliveryRate: 0,
        avgPickupTimeMins: 0,
        avgDeliveryDurationMins: 0,
        totalBreaches: 0,
        slaTier: 'NO_DATA'
      });
      const [schedPickup, setSchedPickup] = useState(defaultSavedLocations[0]?.address || '');
      const [schedDrop, setSchedDrop] = useState(defaultSavedLocations[1]?.address || '');
      const [schedDate, setSchedDate] = useState(new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Kolkata' }).format(new Date()));
      const [schedTime, setSchedTime] = useState('09:00');
      const [schedVehicle, setSchedVehicle] = useState('v_ace');
      const [schedRepeat, setSchedRepeat] = useState('Mon–Sat');
      const [isSubmittingSched, setIsSubmittingSched] = useState(false);

      // Leaflet Map Refs
      const dashboardMapRef = useRef(null);
      const bookingMapRef = useRef(null);
      const trackingMapRef = useRef(null);

      useEffect(() => {
        const savedSession = localStorage.getItem('vaayu_enterprise_merchant');
        if (savedSession && vaayuMerchantToken) {
          try {
            const parsed = JSON.parse(savedSession);
            if (parsed && parsed.id) {
              setMerchant(parsed);
              setAuthMode('AUTHENTICATED');
            }
          } catch(e) {}
        } else if (savedSession) {
          localStorage.removeItem('vaayu_enterprise_merchant');
        }
      }, []);

      const fetchSlaMetrics = () => {
        fetch('/api/merchant/sla-metrics?merchant_id=' + (merchant ? merchant.id : ''))
          .then(r => r.json())
          .then(d => { if (d.success && d.metrics) setSlaMetrics(d.metrics); })
          .catch(e => console.error(e));
      };

      useEffect(() => {
        if (authMode !== 'AUTHENTICATED' || !vaayuMerchantToken) return;
        const refresh = window.setInterval(() => {
          if (document.visibilityState === 'visible') {
            fetchOrders();
            fetchSlaMetrics();
          }
        }, 10000);
        return () => window.clearInterval(refresh);
      }, [authMode, merchant?.id]);

      useEffect(() => {
        if (!trackingModalOrder?.id || !vaayuMerchantToken) return;
        let cancelled = false;
        const refreshTracking = async () => {
          try {
            const response = await fetch('/api/merchant/orders?merchant_id=' + encodeURIComponent(merchant.id));
            const result = await response.json();
            if (!cancelled && response.ok && result.success) {
              setOrdersData(result.orders || []);
              const latest = (result.orders || []).find(order => order.id === trackingModalOrder.id);
              if (latest) setTrackingModalOrder(latest);
            }
          } catch (_) {}
        };
        const timer = window.setInterval(refreshTracking, 5000);
        return () => { cancelled = true; window.clearInterval(timer); };
      }, [trackingModalOrder?.id, merchant?.id]);

      useEffect(() => {
        if (authMode !== 'AUTHENTICATED' || !vaayuMerchantToken) return;
        fetchProfile();
        fetchOrders();
        fetchSchedules();
        fetchSlaMetrics();
      }, [authMode, merchant?.id]);

      const handleSendOtp = async (e) => {
        e.preventDefault();
        setAuthError('');
        if (!authPhone || authPhone.length < 10) {
          setAuthError('Please enter a valid 10-digit mobile number.');
          return;
        }
        setIsAuthSubmitting(true);
        try {
          const response = await nativeMerchantFetch('/api/auth/send-otp', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: authPhone })
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || 'Could not send OTP.');
          setOtpCode(result.otp || '');
          setOtpSent(true);
        } catch (error) {
          setAuthError(error.message || 'Could not send OTP.');
        } finally {
          setIsAuthSubmitting(false);
        }
      };

      const handleVerifyLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        setIsAuthSubmitting(true);
        try {
          const verifyRes = await nativeMerchantFetch('/api/auth/verify-otp', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: authPhone, otp: otpCode })
          });
          const auth = await verifyRes.json();
          if (!verifyRes.ok || !auth.success || auth.user?.role !== 'MERCHANT') throw new Error(auth.error || 'No merchant account is linked to this verified phone.');
          vaayuMerchantToken = auth.token;
          sessionStorage.setItem('vaayu_merchant_token', auth.token);
          const res = await fetch('/api/merchant/profile');
          const data = await res.json();
          if (data.success && data.merchant) {
            setMerchant(data.merchant);
            localStorage.setItem('vaayu_enterprise_merchant', JSON.stringify(data.merchant));
            setAuthMode('AUTHENTICATED');
          } else {
            throw new Error(data.error || 'Merchant profile could not be loaded.');
          }
        } catch(err) {
          setAuthError(err.message || 'Login failed. Please check connection and try again.');
        } finally {
          setIsAuthSubmitting(false);
        }
      };

      const handleSendRegistrationOtp = async (e) => {
        e.preventDefault();
        setAuthError('');
        if (!regPhone || regPhone.length < 10) {
          setAuthError('Please enter a valid 10-digit mobile number.');
          return;
        }
        setIsAuthSubmitting(true);
        try {
          const response = await nativeMerchantFetch('/api/auth/send-otp', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: regPhone })
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || 'Could not send OTP.');
          setRegOtpCode(result.otp || '');
          setRegOtpSent(true);
        } catch (error) {
          setAuthError(error.message || 'Could not send OTP.');
        } finally {
          setIsAuthSubmitting(false);
        }
      };

      const handleRegisterBusiness = async (e) => {
        e.preventDefault();
        setAuthError('');
        setIsAuthSubmitting(true);
        try {
          const verifyResponse = await nativeMerchantFetch('/api/auth/verify-otp', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: regPhone, otp: regOtpCode, isSignUp: true, name: regContactName })
          });
          const verified = await verifyResponse.json();
          if (!verifyResponse.ok || !verified.success) throw new Error(verified.error || 'Verify your phone before registering.');
          vaayuMerchantToken = verified.token;
          sessionStorage.setItem('vaayu_merchant_token', verified.token);
          const res = await fetch('/api/merchant/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              businessName: regBusinessName,
              contactName: regContactName,
              phone: regPhone,
              email: regEmail,
              category: regCategory,
              address: regAddress,
              gstin: regGstin
            })
          });
          const data = await res.json();
          if (data.success && data.merchant) {
            vaayuMerchantToken = data.token;
            sessionStorage.setItem('vaayu_merchant_token', data.token);
            setMerchant(data.merchant);
            localStorage.setItem('vaayu_enterprise_merchant', JSON.stringify(data.merchant));
            setAuthMode('AUTHENTICATED');
          }
        } catch(err) {
          setAuthError('Registration failed. Please try again.');
        } finally {
          setIsAuthSubmitting(false);
        }
      };

      const handleLogout = () => {
        vaayuMerchantToken = null;
        sessionStorage.removeItem('vaayu_merchant_token');
        localStorage.removeItem('vaayu_enterprise_merchant');
        setAuthMode('LOGIN');
        setOtpSent(false);
        setOtpCode('');
      };

      // Initialize Dashboard Live Interactive Leaflet Map
      useEffect(() => {
        if (activeTab === 'dashboard' && window.L) {
          setTimeout(() => {
            const mapContainer = document.getElementById('dashboard-map-container');
            if (mapContainer) {
              if (dashboardMapRef.current) dashboardMapRef.current.remove();

              const map = L.map('dashboard-map-container', { zoomControl: false }).setView([17.4625, 78.3765], 12);
              
              L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a> contributors'
              }).addTo(map);

              // Render Saved Business Locations
              savedLocations.forEach(loc => {
                const locIcon = L.divIcon({
                  html: `<div style="font-size:18px; background:#0f172a; padding:4px; border-radius:8px; border:1px solid #f59e0b;">${loc.icon}</div>`,
                  className: 'saved-loc-pin'
                });
                L.marker([loc.lat, loc.lng], { icon: locIcon }).addTo(map).bindPopup(`<b>${loc.name}</b><br/>${loc.address}`);
              });

              // Render Active Location-to-Location Orders on Map
              const activeRoutes = ordersData.filter(order =>
                Number.isFinite(Number(order.pickupLat)) && Number.isFinite(Number(order.pickupLng)) &&
                Number.isFinite(Number(order.dropLat)) && Number.isFinite(Number(order.dropLng))
              );

              activeRoutes.forEach((route, idx) => {
                const pickup = [Number(route.pickupLat), Number(route.pickupLng)];
                const drop = [Number(route.dropLat), Number(route.dropLng)];
                const pickupIcon = L.divIcon({
                  html: '<div style="font-size:20px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));">📍</div>',
                  className: 'map-pin'
                });
                L.marker(pickup, { icon: pickupIcon }).addTo(map).bindPopup('Pickup: ' + (route.pickupAddress || route.id));

                const dropIcon = L.divIcon({
                  html: '<div style="font-size:20px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));">🎯</div>',
                  className: 'map-pin'
                });
                L.marker(drop, { icon: dropIcon }).addTo(map).bindPopup('Drop: ' + (route.dropAddress || route.id));

                window.VaayuMapEngine.drawRoute(map, [pickup, drop], {
                  color: idx % 2 === 0 ? '#f59e0b' : '#10b981', weight: 4, fitBounds: false
                }).catch(() => {});

                if (route.driver && Number.isFinite(Number(route.driver.currentLat)) && Number.isFinite(Number(route.driver.currentLng))) {
                  const truckIcon = L.divIcon({ html: '<div style="font-size:22px;">🚚</div>', className: 'truck-pin' });
                  L.marker([Number(route.driver.currentLat), Number(route.driver.currentLng)], { icon: truckIcon }).addTo(map).bindPopup(route.driver.name || 'Assigned driver');
                }
              });

              dashboardMapRef.current = map;
            }
          }, 150);
        }
      }, [activeTab, ordersData]);

      // Initialize Step 1 Clean Booking Map
      useEffect(() => {
        if (activeTab === 'new-booking' && bookingStep === 1 && window.L) {
          setTimeout(() => {
            const mapContainer = document.getElementById('booking-map-container');
            if (mapContainer) {
              if (bookingMapRef.current) bookingMapRef.current.remove();

              const map = L.map('booking-map-container', { zoomControl: false }).setView([17.4625, 78.3765], 12);
              L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a> contributors'
              }).addTo(map);

              L.marker([pickupCoords.lat, pickupCoords.lng]).addTo(map).bindPopup('Pickup: ' + pickupLoc);
              L.marker([dropCoords.lat, dropCoords.lng]).addTo(map).bindPopup('Destination: ' + dropLoc);

              window.VaayuMapEngine.drawRoute(map, [
                [pickupCoords.lat, pickupCoords.lng],
                [dropCoords.lat, dropCoords.lng]
              ], { color: '#f59e0b', weight: 4, padding: [30, 30] }).catch(() => {});
              bookingMapRef.current = map;
            }
          }, 100);
        }
      }, [activeTab, bookingStep, pickupCoords, dropCoords]);

      // Initialize Tracking Modal Leaflet Map
      useEffect(() => {
        if (trackingModalOrder && window.L) {
          setTimeout(() => {
            const mapContainer = document.getElementById('tracking-map-container');
            if (mapContainer) {
              if (trackingMapRef.current) trackingMapRef.current.remove();

              const map = L.map('tracking-map-container', { zoomControl: false }).setView([17.4625, 78.3765], 13);
              L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a> contributors'
              }).addTo(map);

              const order = trackingModalOrder;
              const pickup = [Number(order.pickupLat), Number(order.pickupLng)];
              const drop = [Number(order.dropLat), Number(order.dropLng)];
              const hasPickup = pickup.every(Number.isFinite);
              const hasDrop = drop.every(Number.isFinite);
              const points = [];
              if (hasPickup) { L.marker(pickup).addTo(map).bindPopup(order.pickupAddress || 'Pickup'); points.push(pickup); }
              if (hasDrop) { L.marker(drop).addTo(map).bindPopup(order.dropAddress || 'Drop destination'); points.push(drop); }
              const driverLat = Number(order.driver?.currentLat ?? order.driverLat);
              const driverLng = Number(order.driver?.currentLng ?? order.driverLng);
              if (Number.isFinite(driverLat) && Number.isFinite(driverLng)) {
                const truckIcon = L.divIcon({
                  html: '<div style="font-size:24px;">🚚</div>',
                  className: 'truck-pin'
                });
                const marker = L.marker([driverLat, driverLng], { icon: truckIcon }).addTo(map).bindPopup(order.driver?.name || 'Assigned driver');
                marker.openPopup();
                points.push([driverLat, driverLng]);
              }
              if (hasPickup && hasDrop) {
                window.VaayuMapEngine.drawRoute(map, [pickup, drop], {
                  color: '#f59e0b', fitBounds: false, weight: 4
                }).catch(() => {});
              }
              if (points.length > 1) map.fitBounds(L.latLngBounds(points), { padding: [24, 24] });

              trackingMapRef.current = map;
            }
          }, 150);
        }
      }, [trackingModalOrder, selectedTrackingDriverIndex]);

      const fetchProfile = () => {
        fetch('/api/merchant/profile')
          .then(r => r.json())
          .then(d => { if (d.success && d.merchant) setMerchant(d.merchant); })
          .catch(() => {});
        fetch('/api/merchant/staff')
          .then(r => r.json())
          .then(d => { if (d.success && Array.isArray(d.staff)) setStaffList(current => d.staff.length ? d.staff : current); })
          .catch(() => {});
      };

      const fetchOrders = () => {
        fetch('/api/merchant/orders?merchant_id=' + (merchant ? merchant.id : ''))
          .then(r => r.json())
          .then(d => { if (d.success && d.orders) setOrdersData(d.orders); })
          .catch(() => {});
      };

      const fetchSchedules = () => {
        fetch('/api/merchant/schedules?merchant_id=' + (merchant ? merchant.id : ''))
          .then(r => r.json())
          .then(d => { if (d.success && d.schedules) setSchedulesList(d.schedules); })
          .catch(() => {});
      };

      const updateVehicleCount = (vId, delta) => {
        setVehicleCounts(prev => ({
          ...prev,
          [vId]: Math.max(0, (prev[vId] || 0) + delta)
        }));
      };

      const getTotalSelectedVehiclesCount = () => {
        return Object.values(vehicleCounts).reduce((sum, count) => sum + count, 0);
      };

      const getTotalEstimatedFare = () => {
        let total = 0;
        initialVehicles.forEach(v => {
          total += (vehicleCounts[v.id] || 0) * v.fare;
        });
        return total + (helperCount * 200 * getTotalSelectedVehiclesCount());
      };

      const resolveMerchantAddress = async (address, fallback) => {
        try {
          const response = await fetch(`/api/geocoding/search?q=${encodeURIComponent(address)}`);
          const result = await response.json();
          const match = result.results?.[0];
          if (Number.isFinite(Number(match?.lat)) && Number.isFinite(Number(match?.lng))) return { lat: Number(match.lat), lng: Number(match.lng) };
        } catch (_) {}
        return fallback;
      };

      const handleAddStaff = async (e) => {
        e.preventDefault();
        if (!newStaffName || !newStaffPhone) return;
        setMerchantActionError('');
        try {
          const response = await fetch('/api/merchant/staff', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: newStaffName, phone: newStaffPhone, role: newStaffRole, branch: newStaffBranch })
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || 'Staff member could not be saved.');
          setStaffList(current => [...current, result.staff]);
          setNewStaffName('');
          setNewStaffPhone('');
          setShowAddStaffModal(false);
        } catch (error) { setMerchantActionError(error.message || 'Staff member could not be saved.'); }
      };

      const handleParseExcel = async () => {
        try {
          const res = await fetch('/api/merchant/parse-csv', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ csvContent: excelInput })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setExcelValidation(data);
            setMerchantActionError('');
          } else {
            setMerchantActionError(data.error || 'Could not parse this CSV. Check its column names and values.');
          }
        } catch(err) {
          setMerchantActionError(err.message || 'Could not connect to the import service.');
        }
      };

      const handleImportParsedRows = async () => {
        const rows = excelValidation?.validRows || [];
        if (!rows.length) return;
        setIsBookingSubmitting(true);
        setMerchantActionError('');
        try {
          const bookings = await Promise.all(rows.map(async row => {
            const vehicle = initialVehicles.find(item => item.id === row.vehicleCategory) || initialVehicles[0];
            const [pickupPoint, dropPoint] = await Promise.all([
              resolveMerchantAddress(row.pickupAddress, pickupCoords),
              resolveMerchantAddress(row.dropAddress, dropCoords)
            ]);
            return {
              merchantName: merchant.businessName, pickupAddress: row.pickupAddress, dropAddress: row.dropAddress,
              recipientPhone: row.recipientPhone, vehicleName: vehicle.name, vehicleId: vehicle.id, fare: vehicle.fare,
              pickupLat: pickupPoint.lat, pickupLng: pickupPoint.lng, dropLat: dropPoint.lat, dropLng: dropPoint.lng,
              goodsCategory: row.itemDescription || 'Commercial Goods', helperCount: Number(row.helperCount) || 0
            };
          }));
          const response = await fetch('/api/merchant/batch-booking', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ merchant_id: merchant.id, businessOrderId, poReference, requiredSlaTime, bookings })
          });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || 'CSV deliveries could not be imported.');
          setBookingSuccessMsg(`${result.count} CSV deliveries created (₹${Number(result.totalFare || 0).toLocaleString()}) and sent to driver dispatch.`);
          setExcelValidation(null);
          fetchOrders();
        } catch (error) { setMerchantActionError(error.message || 'CSV import failed.'); }
        finally { setIsBookingSubmitting(false); }
      };

      const handleBookAllVehicles = async (e) => {
        e.preventDefault();
        setIsBookingSubmitting(true);
        setBookingSuccessMsg('');
        setMerchantActionError('');

        const [bookingPickup, bookingDrop] = await Promise.all([
          resolveMerchantAddress(pickupLoc, pickupCoords),
          resolveMerchantAddress(dropLoc, dropCoords)
        ]);

        let allBookings = [];
        initialVehicles.forEach(v => {
          const cnt = vehicleCounts[v.id] || 0;
          for (let i = 0; i < cnt; i++) {
            allBookings.push({
              merchantName: merchant.businessName,
              pickupAddress: pickupLoc,
              dropAddress: dropLoc,
              vehicleName: v.name,
              vehicleId: v.id,
              fare: v.fare,
              pickupLat: bookingPickup.lat,
              pickupLng: bookingPickup.lng,
              dropLat: bookingDrop.lat,
              dropLng: bookingDrop.lng,
              helperCount,
              businessOrderId,
              poReference,
              requiredSlaTime
            });
          }
        });

        if (allBookings.length === 0) {
          setMerchantActionError('Select at least one vehicle before booking.');
          setIsBookingSubmitting(false);
          return;
        }

        try {
          const res = await fetch('/api/merchant/batch-booking', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              merchant_id: merchant ? merchant.id : '',
              businessOrderId,
              poReference,
              requiredSlaTime,
              bookings: allBookings
            })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            const assignedCount = (data.dispatch || []).filter(result => result.success).length;
            setBookingSuccessMsg(`🚚 ${data.count} deliveries created (₹${Number(data.totalFare || 0).toLocaleString()}); ${assignedCount} driver offers sent and the rest remain in the dispatch queue. Billed to Monthly Corporate Invoice.`);
            setMerchantActionError('');
            fetchOrders();
            setBookingStep(1);
            setActiveTab('dashboard');
          } else {
            throw new Error(data.error || 'Bulk booking failed.');
          }
        } catch(err) {
          setMerchantActionError(err.message || 'Bulk booking failed.');
        } finally {
          setIsBookingSubmitting(false);
        }
      };

      const handleScheduleSubmit = async (e) => {
        e.preventDefault();
        setIsSubmittingSched(true);
        try {
          const resolveScheduleLocation = async (address, fallback) => {
            try {
              const response = await fetch(`/api/geocoding/search?q=${encodeURIComponent(address)}`);
              const result = await response.json();
              const match = result.results?.[0];
              if (Number.isFinite(Number(match?.lat)) && Number.isFinite(Number(match?.lng))) return { lat: Number(match.lat), lng: Number(match.lng) };
            } catch (_) {}
            return fallback;
          };
          const [schedulePickup, scheduleDrop] = await Promise.all([
            resolveScheduleLocation(schedPickup, pickupCoords),
            resolveScheduleLocation(schedDrop, dropCoords)
          ]);
          const res = await fetch('/api/merchant/schedules', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              merchant_id: merchant ? merchant.id : '',
              type: schedRepeat === 'No' ? 'ONE_TIME' : 'RECURRING',
              timeOfDay: schedTime,
              futureDate: schedDate,
              vehicleType: schedVehicle,
              pickupLat: schedulePickup.lat,
              pickupLng: schedulePickup.lng,
              dropLat: scheduleDrop.lat,
              dropLng: scheduleDrop.lng,
              pickupAddress: schedPickup,
              dropAddress: schedDrop,
              daysOfWeek: [schedRepeat]

          const data = await res.json();
          if (res.ok && data.success) {
            fetchSchedules();
            setMerchantActionError('');
            alert('🎉 Schedule saved. It will create and dispatch the shipment automatically at its scheduled time.');
          } else {
            throw new Error(data.error || 'Schedule could not be saved.');

        } catch(err) {
          setMerchantActionError(err.message || 'Schedule could not be saved.');
        } finally {
          setIsSubmittingSched(false);
        }

          setMerchantActionError(error.message || 'Support ticket could not be created.');

          const objectUrl = URL.createObjectURL(await response.blob());
          const link = document.createElement('a');
          link.href = objectUrl;
          link.download = 'vaayu_monthly_report.csv';
          link.click();
          window.setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);

      const activeDashboardOrders = ordersData.filter(o => o.status !== 'DELIVERED' && o.status !== 'COMPLETED' && o.status !== 'CANCELLED');

                      <input

                      />
                    </div>

                  {otpSent && (
                    <div className="space-y-2">

                        <label className="text-slate-400 font-bold uppercase text-[10px]">VERIFICATION OTP CODE</label>

                          <i className="fa-solid fa-tower-broadcast"></i> Live SMS Inbox

                      <input

                        placeholder="• • • • • •"
                        maxLength="6"
                        required
                      />
                    </div>

                  <button
                    type="submit"

                    {isAuthSubmitting ? 'Authenticating...' : (otpSent ? 'Verify OTP & Launch Portal' : 'Send Verification OTP')}
                  </button>

                  <div className="text-center pt-2 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => { setAuthMode('REGISTER'); setRegPhone(authPhone); setRegOtpSent(false); setRegOtpCode(''); }}
                      className="text-xs text-slate-400 hover:text-amber-400 font-bold transition"
                    >
                      New business? Register your enterprise fleet →
                    </button>
                  </div>
                </form>
              )}

              {/* REGISTRATION FORM */}
              {authMode === 'REGISTER' && (
                <form onSubmit={handleRegisterBusiness} className="space-y-4 text-xs">
                  <div className="border-b border-slate-800 pb-2">

                    <p className="text-[11px] text-slate-400">Outsource your delivery fleet without buying vehicles.</p>
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">BUSINESS NAME</label>
                    <input type="text" value={regBusinessName} onChange={(e) => setRegBusinessName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white" placeholder="e.g. Royal Furniture Works Ltd" required />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">OWNER NAME</label>
                      <input type="text" value={regContactName} onChange={(e) => setRegContactName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white" placeholder="Anil Verma" required />
                    </div>
                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">MOBILE PHONE</label>
                      <input type="text" value={regPhone} onChange={(e) => setRegPhone(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white font-mono" placeholder="9849012345" required disabled={regOtpSent} />
                    </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">BUSINESS CATEGORY</label>
                      <select value={regCategory} onChange={(e) => setRegCategory(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-amber-400 font-bold">
                        <option value="Furniture & Interior Supplies">🛋️ Furniture & Interior</option>
                        <option value="Kirana & FMCG Wholesaler">🛒 Kirana & FMCG</option>
                        <option value="Hardware & Building Materials">🔧 Hardware & Tiles</option>
                        <option value="Electronics & Appliances">📺 Consumer Electronics</option>
                        <option value="Other Commercial Goods">📦 Other Commercial</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">GSTIN (OPTIONAL)</label>
                      <input type="text" value={regGstin} onChange={(e) => setRegGstin(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-cyan-400 font-mono font-bold" placeholder="36ABCDE1234F1Z5" />

                    <input type="text" value={regAddress} onChange={(e) => setRegAddress(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white" placeholder="Kukatpally Industrial Estate, Hyderabad" required />

                  <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">

                    <div className="grid grid-cols-2 gap-3">

                </form>

      return (

                            <span className="font-mono text-emerald-400 font-bold">₹1,12,000 (60%)</span>
                          </div>
                          <div className="w-full bg-slate-900 rounded-full h-2">
                            <div className="bg-emerald-500 h-2 rounded-full" style={{ width: '60%' }}></div>
                          </div>
                        </div>

                        <div>
                          <div className="flex justify-between text-[11px] mb-1">
                            <span className="text-slate-300">Hitec City Store #1</span>
                            <span className="font-mono text-amber-400 font-bold">₹48,500 (26%)</span>
                          </div>
                          <div className="w-full bg-slate-900 rounded-full h-2">
                            <div className="bg-amber-500 h-2 rounded-full" style={{ width: '26%' }}></div>
                          </div>
                        </div>

                        <div>
                          <div className="flex justify-between text-[11px] mb-1">
                            <span className="text-slate-300">Gachibowli Site #4</span>
                            <span className="font-mono text-cyan-400 font-bold">₹24,150 (14%)</span>
                          </div>
                          <div className="w-full bg-slate-900 rounded-full h-2">
                            <div className="bg-cyan-500 h-2 rounded-full" style={{ width: '14%' }}></div>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* FLEET TYPE UTILIZATION */}
                    <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                      <h4 className="font-bold text-white uppercase text-[10px] tracking-wider">FLEET CATEGORY UTILIZATION</h4>
                      <div className="space-y-2">
                        <div>
                          <div className="flex justify-between text-[11px] mb-1">
                            <span className="text-slate-300">🚚 VAAYU Ace (Tata Ace)</span>
                            <span className="font-mono text-amber-400 font-bold">64 Dispatches (45%)</span>
                          </div>
                          <div className="w-full bg-slate-900 rounded-full h-2">
                            <div className="bg-amber-500 h-2 rounded-full" style={{ width: '45%' }}></div>
                          </div>
                        </div>

                        <div>
                          <div className="flex justify-between text-[11px] mb-1">
                            <span className="text-slate-300">🚛 Bolero Pickup (8ft)</span>
                            <span className="font-mono text-cyan-400 font-bold">42 Dispatches (30%)</span>
                          </div>
                          <div className="w-full bg-slate-900 rounded-full h-2">
                            <div className="bg-cyan-500 h-2 rounded-full" style={{ width: '30%' }}></div>
                          </div>
                        </div>

                        <div>
                          <div className="flex justify-between text-[11px] mb-1">
                            <span className="text-slate-300">🛺 3W Auto Commercial</span>
                            <span className="font-mono text-emerald-400 font-bold">22 Dispatches (15%)</span>
                          </div>
                          <div className="w-full bg-slate-900 rounded-full h-2">
                            <div className="bg-emerald-500 h-2 rounded-full" style={{ width: '15%' }}></div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="bg-slate-900 p-6 md:p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6 text-xs">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                    <div>
                      <h2 className="text-xl font-black text-white">{merchant.businessName}</h2>
                      <p className="text-xs text-amber-400 font-semibold mt-1">Corporate Account • {merchant.category}</p>
                    </div>
                  </div>

                  <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800 space-y-4">
                    <div className="flex justify-between items-center border-b border-slate-900 pb-2">
                      <h3 className="font-bold text-amber-400 uppercase text-[10px] tracking-wider">BUSINESS PROFILE & VERIFICATION</h3>
                      <span className="text-[10px] bg-emerald-500/10 text-emerald-400 font-extrabold px-2.5 py-0.5 rounded-full border border-emerald-500/30">
                        ✓ VERIFIED ENTERPRISE
                      </span>
                    </div>

                    <div className="space-y-2">
                      <div className="flex justify-between text-slate-300"><span>Contact Owner:</span><span className="font-bold text-white">{merchant.contactName}</span></div>
                      <div className="flex justify-between text-slate-300"><span>Mobile Phone:</span><span className="font-mono text-white">{merchant.phone}</span></div>
                      <div className="flex justify-between text-slate-300"><span>GSTIN:</span><span className="font-mono text-cyan-400 font-bold">{merchant.gstin || '36ABCDE1234F1Z5'}</span></div>
                    </div>

                    {/* VERIFIED PHOTOS & LOCATION PIN */}
                    <div className="grid grid-cols-2 gap-3 pt-2 border-t border-slate-900">
                      <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-1.5 text-center">
                        <span className="text-[10px] text-slate-400 font-bold block uppercase">Shopfront Signboard</span>
                        <div className="relative overflow-hidden rounded-lg border border-slate-800 h-16 bg-slate-950 flex items-center justify-center">
                          <img src={merchant.storefrontPhotoUrl || 'https://images.unsplash.com/photo-1581094794329-c8112a89af12?w=500'} alt="Storefront" className="h-full w-full object-cover" />
                          <span className="absolute bottom-1 right-1 bg-slate-950/80 text-emerald-400 text-[8px] font-bold px-1.5 py-0.5 rounded border border-emerald-500/30">✓ Verified</span>
                        </div>
                      </div>

                      <div className="bg-slate-900 p-3 rounded-xl border border-slate-800 space-y-1.5 text-center">
                        <span className="text-[10px] text-slate-400 font-bold block uppercase">Depot Location Pin</span>
                        <div className="relative overflow-hidden rounded-lg border border-slate-800 h-16 bg-slate-950 flex items-center justify-center">
                          <img src={merchant.locationPhotoUrl || 'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=500'} alt="Depot Location" className="h-full w-full object-cover" />
                          <span className="absolute bottom-1 right-1 bg-slate-950/80 text-cyan-400 text-[8px] font-bold px-1.5 py-0.5 rounded border border-cyan-500/30">📍 GPS Verified</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* FEATURE 4: STORE MANAGERS & BRANCH STAFF SUB-ACCOUNTS */}
                  <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 space-y-4">
                    <div className="flex justify-between items-center">
                      <div>
                        <h3 className="font-bold text-white text-xs uppercase flex items-center space-x-2">
                          <span>👥</span><span>BRANCH STAFF & STORE MANAGERS ({staffList.length})</span>
                        </h3>
                        <p className="text-[11px] text-slate-400 mt-0.5">Manage sub-accounts for store managers & warehouse dispatchers.</p>
                      </div>
                      <button onClick={() => setShowAddStaffModal(true)} className="px-4 py-2 bg-amber-500 text-slate-950 font-black rounded-xl text-xs">
                        + Add Staff Member
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
                      {staffList.map(stf => (
                        <div key={stf.id} className="bg-slate-900 p-4 rounded-xl border border-slate-800 flex items-center justify-between">
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="font-bold text-white text-xs">{stf.name}</span>
                              <span className="text-[9px] bg-amber-500/10 text-amber-400 font-bold px-2 py-0.5 rounded-full border border-amber-500/20">{stf.role}</span>
                            </div>
                            <span className="text-[11px] text-slate-400 block mt-1">📞 {stf.phone} • {stf.branch}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 flex justify-between items-center">
                    <div>
                      <h3 className="font-bold text-white text-xs uppercase">MONTHLY REPORTS</h3>
                      <p className="text-[11px] text-slate-400 mt-0.5">Download monthly deliveries ledger.</p>
                    </div>
                    <button type="button" onClick={handleDownloadReport} className="px-5 py-2.5 bg-emerald-500 text-slate-950 font-black rounded-2xl text-xs">
                      Download Report (.CSV)
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ADD STAFF MEMBER MODAL */}
            {showAddStaffModal && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                <form onSubmit={handleAddStaff} className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl text-xs">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 className="font-black text-white text-sm">Add Branch Staff Sub-Account</h3>
                    <button type="button" onClick={() => setShowAddStaffModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">FULL NAME</label>
                    <input type="text" value={newStaffName} onChange={(e) => setNewStaffName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white" placeholder="e.g. Srinivas Rao" required />
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">MOBILE PHONE</label>
                    <input type="text" value={newStaffPhone} onChange={(e) => setNewStaffPhone(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white font-mono" placeholder="9849112233" required />
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">ROLE</label>
                    <select value={newStaffRole} onChange={(e) => setNewStaffRole(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-amber-400 font-bold">
                      <option value="STORE_MANAGER">Store Manager</option>
                      <option value="DISPATCHER">Warehouse Dispatcher</option>
                      <option value="ACCOUNTANT">Accountant</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">ASSIGNED BRANCH</label>
                    <select value={newStaffBranch} onChange={(e) => setNewStaffBranch(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-white">
                      <option value="Kukatpally Depot">Kukatpally Depot</option>
                      <option value="Hitec City Store #1">Hitec City Store #1</option>
                      <option value="Gachibowli Site #4">Gachibowli Site #4</option>
                      <option value="All Branches">All Branches</option>
                    </select>
                  </div>

                  <div className="flex space-x-3 pt-2">
                    <button type="button" onClick={() => setShowAddStaffModal(false)} className="w-1/3 py-2.5 bg-slate-800 text-white font-bold rounded-xl">Cancel</button>
                    <button type="submit" className="w-2/3 py-2.5 bg-amber-500 text-slate-950 font-black rounded-xl uppercase">Save Sub-Account</button>
                  </div>
                </form>
              </div>
            )}

            {/* FEATURE 12: DISPUTE / SUPPORT ISSUE MODAL */}
            {disputeModalOrder && (
              <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                <form onSubmit={handleMerchantDisputeSubmit} className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl text-xs">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                    <div>
                      <span className="text-[10px] text-rose-400 font-mono font-bold block">{disputeModalOrder.id}</span>
                      <h3 className="font-black text-white text-sm">Report Issue / Dispute Ticket</h3>
                    </div>
                    <button type="button" onClick={() => setDisputeModalOrder(null)} className="text-slate-400 hover:text-white font-bold">✕</button>
                  </div>

                  {disputeSuccessMsg ? (
                    <div className="p-4 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-center font-bold rounded-2xl space-y-1">
                      <div className="text-xl">✅</div>
                      <div>{disputeSuccessMsg}</div>
                    </div>
                  ) : (
                    <>
                      <div>
                        <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">ISSUE CATEGORY</label>
                        <select value={disputeReason} onChange={(e) => setDisputeReason(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-amber-400 font-bold">
                          <option value="Package Damaged">📦 Package / Cargo Damaged</option>
                          <option value="Missing Item">❓ Missing Items / Partial Delivery</option>
                          <option value="Wrong Delivery Location">📍 Delivered to Wrong Address</option>
                          <option value="Driver Conduct / Delay">🚚 Unreasonable Driver Delay</option>
                          <option value="Incorrect Charge">💰 Billing / Fare Dispute</option>
                        </select>
                      </div>

                      <div>
                        <label className="text-slate-400 font-bold block mb-1 uppercase text-[10px]">ISSUE DETAILS & COMMENTS</label>
                        <textarea
                          rows="3"
                          value={disputeNotes}
                          onChange={(e) => setDisputeNotes(e.target.value)}
                          placeholder="Describe damage, missing items, or delivery discrepancy..."
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-xs outline-none focus:border-rose-500"
                          required
                        />
                      </div>

                      <div className="p-3 bg-slate-950 rounded-xl border border-dashed border-slate-800 text-center text-slate-400">
                        <i className="fa-solid fa-camera mb-1 block text-slate-500"></i>
                        <span className="text-[10px] font-bold text-amber-400">📸 Attach Photo Evidence (Optional)</span>
                      </div>

                      <div className="flex space-x-3 pt-2">
                        <button type="button" onClick={() => setDisputeModalOrder(null)} className="w-1/3 py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl">Cancel</button>
                        <button type="submit" className="w-2/3 py-2.5 bg-rose-500 text-slate-950 font-black rounded-xl uppercase tracking-wider">Submit Ticket to Control Tower</button>
                      </div>
                    </>
                  )}
                </form>
              </div>
            )}

          </main>

          {/* DEDICATED MULTI-VEHICLE TRACKING MODAL */}
          {trackingModalOrder && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-3xl w-full p-6 space-y-6 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <div>
                    <span className="text-[10px] text-amber-400 font-mono font-bold block">{trackingModalOrder.id}</span>
                    <h3 className="font-black text-white text-sm">Live Multi-Vehicle Tracking Map</h3>
                  </div>
                  <button onClick={() => setTrackingModalOrder(null)} className="text-slate-400 hover:text-white font-black text-lg">✕</button>
                </div>

                <div className="h-64 w-full rounded-2xl overflow-hidden border border-slate-800 relative">
                  <div id="tracking-map-container" className="h-full w-full"></div>
                </div>

                <div className="space-y-3 text-xs">
                  <h4 className="font-bold text-slate-400 uppercase text-[10px]">ASSIGNED DRIVER & LIVE LOCATION</h4>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    {trackingModalOrder.driver ? (
                      <div className="p-3 rounded-2xl border border-amber-500 bg-amber-500/10 text-left">
                        <span className="font-bold text-white block">{trackingModalOrder.driver.vehicleNumber || trackingModalOrder.driver.vehicleType || 'Assigned vehicle'}</span>
                        <span className="text-[11px] text-slate-300 block mt-1">{trackingModalOrder.driver.name || 'Assigned driver'}{trackingModalOrder.driver.phone ? ` • ${trackingModalOrder.driver.phone}` : ''}</span>
                        <span className="text-[10px] text-emerald-400 font-semibold block">{trackingModalOrder.status || 'Assignment active'}{trackingModalOrder.eta ? ` • ETA ${trackingModalOrder.eta}` : ''}</span>
                      </div>
                    ) : <p className="text-slate-400 p-3">No driver has been assigned to this delivery yet.</p>}
                  </div>
                </div>

                {/* FEATURE 3: SHARE LIVE CUSTOMER TRACKING LINK */}
                <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-col md:flex-row items-center justify-between gap-3 text-xs">
                  <div>
                    <span className="font-bold text-white block flex items-center space-x-1.5">
                      <span>📱</span><span>Share Live Tracking Link with Buyer</span>
                    </span>
                    <span className="text-[11px] text-slate-400">Send customer a live map tracking link without requiring login.</span>
                  </div>
                  <div className="flex items-center space-x-2 w-full md:w-auto">
                    {trackingModalOrder.trackingToken ? (() => {
                      const trackUrl = new URL(`/t/${encodeURIComponent(trackingModalOrder.trackingToken)}`, window.location.origin).toString();
                      return <>
                        <a href={`https://api.whatsapp.com/send?text=${encodeURIComponent(`Your delivery is on its way. Track it here: ${trackUrl}`)}`} target="_blank" rel="noopener noreferrer" className="px-4 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs flex items-center space-x-1.5 shadow-lg shadow-emerald-500/20">
                          <i className="fa-brands fa-whatsapp text-sm"></i><span>WhatsApp Link</span>
                        </a>
                        <button onClick={() => { navigator.clipboard.writeText(trackUrl); setCopiedTrackMsg('Link Copied to Clipboard!'); setTimeout(() => setCopiedTrackMsg(''), 3000); }} className="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold rounded-xl text-xs border border-slate-700">{copiedTrackMsg || '📋 Copy URL'}</button>
                      </>;
                    })() : <span className="text-slate-400">A public tracking link is unavailable for this delivery.</span>}
                  </div>
                </div>

                {/* Proof of delivery is shown only when the backend has stored evidence. */}
                <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800 space-y-3 text-xs">
                  <div className="flex justify-between items-center border-b border-slate-900 pb-2">
                    <h4 className="font-bold text-amber-400 uppercase text-[10px] tracking-wider">Proof of Delivery & E-Signature</h4>
                    <span className="text-[10px] text-slate-400">{trackingModalOrder.pod ? 'Evidence recorded' : 'No evidence recorded'}</span>
                  </div>
                  {trackingModalOrder.pod ? <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {trackingModalOrder.pod.receiverName && <div><span className="text-slate-400 block">Receiver</span><span className="text-white">{trackingModalOrder.pod.receiverName}</span></div>}
                    {trackingModalOrder.pod.createdAt && <div><span className="text-slate-400 block">Recorded</span><span className="text-white">{new Date(trackingModalOrder.pod.createdAt).toLocaleString()}</span></div>}
                    {trackingModalOrder.pod.receiverSignature && <div><span className="text-slate-400 block">Receiver signature</span><img src={trackingModalOrder.pod.receiverSignature} alt="Receiver signature" className="max-h-24 max-w-full object-contain" /></div>}
                    {trackingModalOrder.pod.podPhotoUrl && <div><span className="text-slate-400 block">Delivery photo</span><img src={trackingModalOrder.pod.podPhotoUrl} alt="Proof of delivery" className="max-h-40 rounded-lg" /></div>}
                  </div> : <p className="text-slate-400">The driver has not submitted proof of delivery for this trip.</p>}
                </div>

                <button onClick={() => setTrackingModalOrder(null)} className="w-full py-3 bg-slate-800 text-white font-bold rounded-2xl text-xs">Close Tracking Screen</button>
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION BAR ALWAYS VISIBLE */}
          <nav className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 px-6 py-3 flex justify-around items-center z-40 shadow-2xl">
            <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center space-y-1 text-xs font-bold ${activeTab === 'dashboard' ? 'text-amber-400' : 'text-slate-400 hover:text-white'}`}>
              <span className="text-lg">🏠</span><span className="text-[10px]">Dashboard</span>
            </button>
            <button onClick={() => { setActiveTab('new-booking'); setBookingStep(1); }} className={`flex flex-col items-center space-y-1 text-xs font-bold ${activeTab === 'new-booking' ? 'text-amber-400' : 'text-slate-400 hover:text-white'}`}>
              <span className="text-lg">➕</span><span className="text-[10px]">New Booking</span>
            </button>
            <button onClick={() => setActiveTab('deliveries')} className={`flex flex-col items-center space-y-1 text-xs font-bold ${activeTab === 'deliveries' ? 'text-amber-400' : 'text-slate-400 hover:text-white'}`}>
              <span className="text-lg">📦</span><span className="text-[10px]">Deliveries</span>
            </button>
            <button onClick={() => setActiveTab('schedule')} className={`flex flex-col items-center space-y-1 text-xs font-bold ${activeTab === 'schedule' ? 'text-amber-400' : 'text-slate-400 hover:text-white'}`}>
              <span className="text-lg">📅</span><span className="text-[10px]">Schedule</span>
            </button>
            <button onClick={() => setActiveTab('account')} className={`flex flex-col items-center space-y-1 text-xs font-bold ${activeTab === 'account' ? 'text-amber-400' : 'text-slate-400 hover:text-white'}`}>
              <span className="text-lg">👤</span><span className="text-[10px]">Account</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('merchant-root')).render(<EnterprisePortalApp />);
  </script>
</body>
</html>
